<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trimble Claude Assistant</title><style>body{margin:0;font:14px system-ui;background:#f5f6f8;color:#20242a}header{padding:14px 18px;background:#fff;border-bottom:1px solid #ddd;font-weight:700}.wrap{max-width:900px;margin:auto;padding:18px}.chat{height:62vh;overflow:auto;background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px}.msg{padding:10px 12px;margin:8px 0;border-radius:10px;white-space:pre-wrap}.user{background:#eef3ff}.assistant{background:#f2f2f2}.bar{display:flex;gap:8px;margin-top:10px}input{flex:1;padding:12px;border:1px solid #ccc;border-radius:8px}button{padding:12px 16px;border:0;border-radius:8px;cursor:pointer}.login{background:#fff;border:1px solid #ddd;padding:14px;margin-bottom:12px}</style></head><body><header>Trimble Connect · Claude Assistant</header><div class="wrap"><div class="login"><span id="status">Checking Trimble authentication…</span> <button id="login" hidden>Sign in with Trimble</button></div><div id="chat" class="chat"></div><div class="bar"><input id="q" placeholder="Ask about your Trimble Connect project…"><button id="send">Send</button></div></div><script>
const API=location.hostname==='localhost'?'http://localhost:3000':'https://YOUR-RENDER-NAME.onrender.com';const chat=document.querySelector('#chat');
function add(role,text){const d=document.createElement('div');d.className='msg '+role;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
async function status(){try{let r=await fetch(API+'/auth/status',{credentials:'include'});if(r.ok){document.querySelector('#status').textContent='Trimble authenticated';}else throw 0}catch{document.querySelector('#status').textContent='Trimble authentication required';document.querySelector('#login').hidden=false}}
document.querySelector('#login').onclick=()=>location.href=API+'/oauth/login';
document.querySelector('#send').onclick=async()=>{const q=document.querySelector('#q').value.trim();if(!q)return;add('user',q);document.querySelector('#q').value='';add('assistant','For the starter build, connect this UI to your Claude orchestration endpoint. The MCP endpoint is '+API+'/mcp');};document.querySelector('#q').addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('#send').click()});status();
</script></body></html>
