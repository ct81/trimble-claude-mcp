<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML & JavaScript Code Editor</title>

<!-- CodeMirror Editor -->
<link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">

<link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>

<style>
:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --text: #1f2430;
  --muted: #6b7280;
  --line: #e6e8f0;
  --brand: #4f46e5;
  --brand-soft: #eef2ff;
  --radius: 14px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 32px 16px 60px;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", system-ui, Arial, sans-serif;
  display: flex;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}

.app {
  width: 100%;
  max-width: 1100px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: 0 18px 40px rgba(23,29,58,.08);
  overflow: hidden;
}

/* Header */

.header {
  padding: 22px 24px;
  border-bottom: 1px solid var(--line);
}

.header h2 {
  margin: 0;
  font-size: 21px;
}

.header p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 13px;
}

/* Tabs */

.tabs {
  display: flex;
  gap: 6px;
  padding: 12px 14px 0;
  background: #fbfcff;
  border-bottom: 1px solid var(--line);
}

.tab {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-weight: 600;
  font-size: 14px;
  padding: 11px 18px;
  border-radius: 10px 10px 0 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  position: relative;
  transition: .18s ease;
}

.tab:hover {
  color: var(--text);
  background: #f3f4fa;
}

.tab.active {
  color: var(--brand);
  background: var(--brand-soft);
}

.tab.active::after {
  content: "";
  position: absolute;
  left: 14px;
  right: 14px;
  bottom: -1px;
  height: 2px;
  background: var(--brand);
}

/* Editor panels */

.panel {
  display: none;
  padding: 22px;
}

.panel.active {
  display: block;
  animation: fade .2s ease;
}

@keyframes fade {
  from {
    opacity: 0;
    transform: translateY(5px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Toolbar */

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 12px 12px 0 0;
  background: #f8f9ff;
  flex-wrap: wrap;
}

.file-name {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 600;
  font-family: monospace;
  color: #3b4252;
}

.file-icon {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #fbbf24;
  box-shadow: 9px 0 #f87171, 18px 0 #34d399;
  margin-right: 18px;
}

.toolbar-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

/* Buttons */

.btn {
  appearance: none;
  border: 0;
  font: inherit;
  font-weight: 600;
  font-size: 13px;
  padding: 9px 14px;
  border-radius: 9px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: .16s ease;
}

.btn-primary {
  background: var(--brand);
  color: white;
  box-shadow: 0 5px 12px rgba(79,70,229,.2);
}

.btn-primary:hover {
  background: #4338ca;
  transform: translateY(-1px);
}

.btn-ghost {
  background: #f3f4fa;
  color: #3b4252;
  border: 1px solid var(--line);
}

.btn-ghost:hover {
  background: #eceefa;
}

.btn-danger {
  background: #fff1f2;
  color: #be123c;
  border: 1px solid #fecdd3;
}

.btn:disabled {
  opacity: .6;
  cursor: default;
}

/* CodeMirror */

.editor-container {
  border: 1px solid var(--line);
  border-radius: 0 0 12px 12px;
  overflow: hidden;
}

.CodeMirror {
  height: 430px;
  font-family: Consolas, Monaco, monospace;
  font-size: 13px;
  line-height: 1.65;
}

.CodeMirror-gutters {
  border-right: 1px solid #343b46;
}

.CodeMirror-linenumber {
  color: #84909f;
}

.CodeMirror-focused {
  outline: none;
}

/* Footer */

.editor-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 2px;
  gap: 10px;
  flex-wrap: wrap;
}

.status {
  font-size: 12px;
  color: var(--muted);
}

.status.success {
  color: #16a34a;
}

.status.error {
  color: #dc2626;
}

/* Preview */

.preview-section {
  margin-top: 22px;
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}

.preview-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 15px;
  background: #f8f9ff;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  font-weight: 600;
}

.preview-frame {
  display: block;
  width: 100%;
  height: 400px;
  border: 0;
  background: white;
}

.preview-placeholder {
  height: 180px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--muted);
  font-size: 13px;
  background: white;
}

.preview-placeholder svg {
  color: #9ca3af;
}

.hidden {
  display: none !important;
}

/* Responsive */

@media(max-width: 600px) {

  body {
    padding: 12px 7px 25px;
  }

  .header {
    padding: 18px;
  }

  .panel {
    padding: 12px;
  }

  .tab {
    padding: 10px 12px;
    font-size: 12px;
  }

  .toolbar {
    padding: 9px;
  }

  .toolbar-actions {
    width: 100%;
  }

  .btn {
    font-size: 12px;
    padding: 8px 10px;
  }

  .CodeMirror {
    height: 380px;
    font-size: 12px;
  }

  .preview-frame {
    height: 350px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">
    <h2>Code Editor</h2>
    <p>Write, edit and execute your HTML and JavaScript code.</p>
  </div>


  <!-- TABS -->

  <div class="tabs" role="tablist">

    <button class="tab active"
            id="tab-html"
            role="tab"
            aria-selected="true"
            aria-controls="panel-html"
            data-tab="html">

      <svg width="16" height="16" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
        <path d="M14 3v6h6M8 13h8M8 17h5"/>
      </svg>

      HTML Code

    </button>

    <button class="tab"
            id="tab-js"
            role="tab"
            aria-selected="false"
            aria-controls="panel-js"
            data-tab="js">

      <svg width="16" height="16" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.8">
        <polyline points="16 18 22 12 16 6"/>
        <polyline points="8 6 2 12 8 18"/>
      </svg>

      JavaScript Code

    </button>

  </div>


  <!-- HTML EDITOR -->

  <section class="panel active"
           id="panel-html"
           role="tabpanel">

    <div class="toolbar">

      <span class="file-name">
        <span class="file-icon"></span>
        index.html
      </span>

      <div class="toolbar-actions">

        <button class="btn btn-ghost" id="copyHtml">
          Copy All
        </button>

        <button class="btn btn-danger" id="clearHtml">
          Clear
        </button>

      </div>

    </div>

    <div class="editor-container">
      <textarea id="htmlEditor"></textarea>
    </div>

    <div class="editor-footer">

      <span class="status" id="htmlStatus">
        HTML editor ready
      </span>

      <span class="status">
        HTML / CSS
      </span>

    </div>

  </section>


  <!-- JAVASCRIPT EDITOR -->

  <section class="panel"
           id="panel-js"
           role="tabpanel">

    <div class="toolbar">

      <span class="file-name">
        <span class="file-icon"></span>
        script.js
      </span>

      <div class="toolbar-actions">

        <button class="btn btn-ghost" id="copyJs">
          Copy All
        </button>

        <button class="btn btn-danger" id="clearJs">
          Clear
        </button>

      </div>

    </div>

    <div class="editor-container">
      <textarea id="jsEditor"></textarea>
    </div>

    <div class="editor-footer">

      <span class="status" id="jsStatus">
        JavaScript editor ready
      </span>

      <span class="status">
        JavaScript
      </span>

    </div>

  </section>


  <!-- RUN AND RESET -->

  <div style="padding:0 22px 20px;">

    <div style="display:flex;gap:10px;flex-wrap:wrap;">

      <button class="btn btn-primary" id="runCode">

        <svg width="15" height="15" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>

        Run Code

      </button>

      <button class="btn btn-ghost" id="resetCode">
        Reset Example
      </button>

    </div>


    <!-- LIVE PREVIEW -->

    <div class="preview-section">

      <div class="preview-header">

        <span>Live Preview</span>

        <span class="status" id="previewStatus">
          Waiting to run
        </span>

      </div>

      <div class="preview-placeholder" id="previewPlaceholder">

        <svg width="32" height="32" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <path d="M3 9h18M8 6.5h.01M11 6.5h.01"/>
        </svg>

        <span>Click Run Code to see your output</span>

      </div>

      <iframe id="previewFrame"
              class="preview-frame hidden"
              title="Code preview"
              sandbox="allow-scripts">
      </iframe>

    </div>

  </div>

</div>


<script>

/* =========================================================
   1. DEFAULT HTML CODE
   ========================================================= */

const DEFAULT_HTML = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My First Application</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f4f6fb;
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 12px;
      max-width: 500px;
      margin: auto;
    }

    h1 {
      color: #4f46e5;
    }

    button {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Hello World!</h1>

    <p>Welcome to my HTML application.</p>

    <button id="myButton">Click Me</button>

    <p id="output"></p>

  </div>

</body>
</html>`;


/* =========================================================
   2. DEFAULT JAVASCRIPT CODE
   ========================================================= */

const DEFAULT_JS = `// JavaScript application logic

const button = document.getElementById('myButton');

const output = document.getElementById('output');

button.addEventListener('click', () => {

  output.textContent = 'Hello! Your JavaScript is working.';

  console.log('Button clicked successfully.');

});`;


/* =========================================================
   3. INITIALIZE EDITORS
   ========================================================= */

const htmlEditor = CodeMirror.fromTextArea(
  document.getElementById('htmlEditor'),
  {
    mode: 'htmlmixed',
    theme: 'material-darker',
    lineNumbers: true,
    lineWrapping: false,
    autoCloseTags: true,
    matchBrackets: true,
    indentUnit: 2,
    tabSize: 2,
    indentWithTabs: false,
    extraKeys: {
      "Ctrl-Space": "autocomplete"
    }
  }
);

const jsEditor = CodeMirror.fromTextArea(
  document.getElementById('jsEditor'),
  {
    mode: 'javascript',
    theme: 'material-darker',
    lineNumbers: true,
    lineWrapping: false,
    matchBrackets: true,
    autoCloseBrackets: true,
    indentUnit: 2,
    tabSize: 2,
    indentWithTabs: false,
    extraKeys: {
      "Ctrl-Space": "autocomplete"
    }
  }
);


/* =========================================================
   4. SET DEFAULT CODE
   ========================================================= */

htmlEditor.setValue(DEFAULT_HTML);
jsEditor.setValue(DEFAULT_JS);


/* =========================================================
   5. TAB SWITCHING
   ========================================================= */

const tabs = document.querySelectorAll('.tab');
const panels = document.querySelectorAll('.panel');

tabs.forEach(tab => {

  tab.addEventListener('click', () => {

    tabs.forEach(t => {

      const active = t === tab;

      t.classList.toggle('active', active);

      t.setAttribute(
        'aria-selected',
        String(active)
      );

    });

    panels.forEach(panel => {

      panel.classList.toggle(
        'active',
        panel.id === 'panel-' + tab.dataset.tab
      );

    });

    // Refresh editor dimensions when shown
    setTimeout(() => {

      if (tab.dataset.tab === 'html') {
        htmlEditor.refresh();
      } else {
        jsEditor.refresh();
      }

    }, 50);

  });

});


/* =========================================================
   6. COPY CODE
   ========================================================= */

async function copyText(text, button) {

  try {

    if (navigator.clipboard && window.isSecureContext) {

      await navigator.clipboard.writeText(text);

    } else {

      const textarea = document.createElement('textarea');

      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';

      document.body.appendChild(textarea);

      textarea.select();

      if (!document.execCommand('copy')) {
        throw new Error('Copy failed');
      }

      textarea.remove();

    }

    const original = button.textContent;

    button.textContent = 'Copied!';
    button.disabled = true;

    setTimeout(() => {

      button.textContent = original;
      button.disabled = false;

    }, 1200);

  } catch (error) {

    alert('Unable to copy code. Please select and copy manually.');

  }

}


/* =========================================================
   7. COPY ALL BUTTONS
   ========================================================= */

document.getElementById('copyHtml')
  .addEventListener('click', function() {

    copyText(htmlEditor.getValue(), this);

  });

document.getElementById('copyJs')
  .addEventListener('click', function() {

    copyText(jsEditor.getValue(), this);

  });


/* =========================================================
   8. CLEAR EDITORS
   ========================================================= */

document.getElementById('clearHtml')
  .addEventListener('click', () => {

    if (confirm('Clear all HTML code?')) {

      htmlEditor.setValue('');

      document.getElementById('htmlStatus').textContent =
        'HTML cleared';

    }

  });

document.getElementById('clearJs')
  .addEventListener('click', () => {

    if (confirm('Clear all JavaScript code?')) {

      jsEditor.setValue('');

      document.getElementById('jsStatus').textContent =
        'JavaScript cleared';

    }

  });


/* =========================================================
   9. RESET EXAMPLE
   ========================================================= */

document.getElementById('resetCode')
  .addEventListener('click', () => {

    if (confirm('Restore the default example code?')) {

      htmlEditor.setValue(DEFAULT_HTML);

      jsEditor.setValue(DEFAULT_JS);

      document.getElementById('htmlStatus').textContent =
        'HTML restored';

      document.getElementById('jsStatus').textContent =
        'JavaScript restored';

    }

  });


/* =========================================================
   10. RUN HTML + JAVASCRIPT
   ========================================================= */

document.getElementById('runCode')
  .addEventListener('click', runCode);

function runCode() {

  const html = htmlEditor.getValue();

  const js = jsEditor.getValue();

  const frame = document.getElementById('previewFrame');

  const placeholder = document.getElementById('previewPlaceholder');

  const status = document.getElementById('previewStatus');

  try {

    // Convert user JavaScript to a safely embedded string.
    const safeJS = JSON.stringify(js)
      .replace(/</g, '\\u003c');

    const executionScript = `
      <script>
      (() => {

        const userCode = ${safeJS};

        try {

          const execute = new Function(userCode);

          execute();

          window.parent.postMessage({
            type: 'editor-run-success'
          }, '*');

        } catch (error) {

          document.body.insertAdjacentHTML(
            'beforeend',
            '<pre style="color:red;white-space:pre-wrap;padding:12px;"></pre>'
          );

          document.body.lastElementChild.textContent =
            error.stack || error.message;

          window.parent.postMessage({
            type: 'editor-run-error',
            message: error.message
          }, '*');

        }

      })();
      <\/script>
    `;

    // Insert the JavaScript before closing body.
    let finalHTML = html;

    if (/<\/body\s*>/i.test(finalHTML)) {

      finalHTML = finalHTML.replace(
        /<\/body\s*>/i,
        executionScript + '</body>'
      );

    } else {

      finalHTML += executionScript;

    }

    // Show preview
    placeholder.classList.add('hidden');

    frame.classList.remove('hidden');

    status.textContent = 'Running...';

    frame.srcdoc = finalHTML;

  } catch (error) {

    status.textContent = 'Error: ' + error.message;

  }

}


/* =========================================================
   11. PREVIEW EXECUTION STATUS
   ========================================================= */

window.addEventListener('message', event => {

  // Only accept messages from the preview iframe.
  const frame = document.getElementById('previewFrame');

  if (event.source !== frame.contentWindow) return;

  const status = document.getElementById('previewStatus');

  if (event.data?.type === 'editor-run-success') {

    status.textContent = 'Executed successfully';

    status.className = 'status success';

  }

  if (event.data?.type === 'editor-run-error') {

    status.textContent = 'JavaScript error';

    status.className = 'status error';

  }

});


/* =========================================================
   12. EDITOR CHANGE STATUS
   ========================================================= */

htmlEditor.on('change', () => {

  document.getElementById('htmlStatus').textContent =
    'HTML modified';

});

jsEditor.on('change', () => {

  document.getElementById('jsStatus').textContent =
    'JavaScript modified';

});

</script>

</body>
</html>
