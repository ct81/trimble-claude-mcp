<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Penalty Shootout - Fullscreen Ready</title>
    <style>
        :root {
            --bg-dark: #0a0a0e;
            --neon-blue: #00f3ff;
            --text-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, #1a1a2e 0%, transparent 50%),
                linear-gradient(180deg, #0a0a0e 0%, #000000 100%);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* Main Game Window */
        .game-window {
            width: 100%;
            height: 100%;
            max-width: 900px;
            max-height: 800px;
            display: flex;
            flex-direction: column;
            border: 3px solid var(--neon-blue);
            background-color: #000;
            position: relative;
            transition: all 0.3s ease;
        }

        /* Desktop styling */
        @media (min-width: 901px) {
            .game-window {
                border-radius: 12px;
                box-shadow: 0 0 40px rgba(0, 243, 255, 0.3), inset 0 0 20px rgba(0, 243, 255, 0.1);
                height: 90vh;
            }
        }

        /* Fullscreen styling */
        .game-window:fullscreen,
        .game-window:-webkit-full-screen {
            max-width: none;
            max-height: none;
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            border: none;
        }

        .window-header {
            background: rgba(10, 10, 15, 0.9);
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            z-index: 10;
        }

        .window-title {
            font-size: 12px;
            color: #ccc;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .window-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .control-btn {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #333;
        }

        .fullscreen-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            margin-left: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .fullscreen-btn:hover { opacity: 1; }

        /* Canvas Area */
        .canvas-container {
            flex: 1;
            position: relative;
            background: #000;
            cursor: crosshair;
            overflow: hidden;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Top Scoreboard Overlay */
        .scoreboard {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
            background: rgba(0,0,0,0.6);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            pointer-events: none;
        }

        .score-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 60px;
        }
        .score-box.you { border-right: 1px solid #333; padding-right: 10px; }
        .score-box.opponent { border-left: 1px solid #333; padding-left: 10px; }

        .score-label { font-size: 10px; color: #aaa; text-transform: uppercase; }
        .score-value { font-size: 24px; font-weight: bold; color: #fff; line-height: 1; margin-top: 2px;}
        .score-box.you .score-value { color: #4facfe; }
        .score-box.opponent .score-value { color: #f53939; }
        
        .vs-badge { font-size: 12px; font-weight: bold; color: #888; background: #111; padding: 3px 6px; border-radius: 4px; border: 1px solid #333;}

        /* Bottom Controls */
        .bottom-controls {
            background: linear-gradient(180deg, #111 0%, #0a0a15 100%);
            padding: 10px 15px;
            border-top: 2px solid #1a1a2e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            flex-wrap: wrap;
            gap: 10px;
        }

        .instruction-text {
            font-size: 12px;
            color: #888;
            font-style: italic;
            flex: 1 1 100%;
            text-align: center;
        }

        @media (min-width: 600px) {
            .instruction-text { flex: 1; text-align: left; }
            .bottom-controls { flex-wrap: nowrap; }
        }

        .status-bar {
            display: flex;
            gap: 15px;
            background: #000;
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid #222;
            font-size: 14px;
            font-weight: bold;
            margin: 0 auto;
        }

        .status-item { color: #fff; display: flex; align-items: center; gap: 5px;}
        .status-item span { color: #f1c40f; font-size: 18px; }

        /* Message Overlay */
        .message-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px rgba(0,0,0,0.8), 0 0 40px currentColor;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 20;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 2px;
            white-space: nowrap;
        }
        
        .message-overlay.show {
            opacity: 1;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

    </style>
</head>
<body>

    <div class="game-window" id="gameWindow">
        <div class="window-header">
            <div class="window-title">🛡️ PenaltyShootout.exe</div>
            <div class="window-controls">
                <div class="control-btn" style="background:#f1c40f"></div>
                <div class="control-btn" style="background:#2ecc71"></div>
                <div class="control-btn" style="background:#e74c3c"></div>
                <!-- Fullscreen Button -->
                <button class="fullscreen-btn" id="fullscreenBtn" title="Toggle Fullscreen">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="canvas-container" id="canvasContainer">
            <canvas id="gameCanvas"></canvas>
            
            <div class="scoreboard">
                <div class="score-box you">
                    <div class="score-label">You</div>
                    <div class="score-value" id="playerScore">0</div>
                </div>
                <div class="vs-badge">VS</div>
                <div class="score-box opponent">
                    <div class="score-label">Opponent</div>
                    <div class="score-value" id="oppScore">0</div>
                </div>
            </div>

            <div class="message-overlay" id="msgOverlay">GOAL!</div>
        </div>

        <div class="bottom-controls">
            <div class="instruction-text">Drag from ball to shoot. Curve to bend.</div>
            <div class="status-bar">
                <div class="status-item">Goals: <span id="goalCount">0</span></div>
                <div class="status-item" style="color:#444">|</div>
                <div class="status-item">Misses: <span id="missCount">0</span></div>
            </div>
        </div>
    </div>

    <script>
        const gameWindow = document.getElementById('gameWindow');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        
        let width, height;
        let centerX;

        // Game State
        let gameState = 'aiming'; // aiming, shooting, result
        let goals = 0;
        let misses = 0;
        let playerScore = 0;
        let oppScore = 0;

        // UI Elements
        const goalCountEl = document.getElementById('goalCount');
        const missCountEl = document.getElementById('missCount');
        const playerScoreEl = document.getElementById('playerScore');
        const oppScoreEl = document.getElementById('oppScore');
        const msgOverlay = document.getElementById('msgOverlay');

        // Input Tracking
        let isDragging = false;
        let dragPath = []; 

        // Ball Physics
        let ball = {
            startX: 0, startY: 0,
            currentX: 0, currentY: 0,
            controlX: 0, controlY: 0, 
            endX: 0, endY: 0,         
            scale: 1,
            progress: 0,
            speed: 0.02,
            spin: 0,
            active: true
        };

        // Goalkeeper
        let keeper = {
            x: 0, y: 0,
            startX: 0, startY: 0,
            targetX: 0, targetY: 0,
            state: 'idle', 
            diveDir: 0 
        };

        // Goal Dimensions
        const goal = {
            x: 0, y: 0,
            w: 400, h: 150,
            postWidth: 8
        };

        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            centerX = width / 2;

            goal.w = Math.min(width * 0.7, 600);
            goal.h = height * 0.25;
            goal.x = centerX - goal.w / 2;
            goal.y = height * 0.35;

            ball.startX = centerX;
            ball.startY = height * 0.82;
            if (!isDragging && gameState === 'aiming') {
                ball.currentX = ball.startX;
                ball.currentY = ball.startY;
            }

            keeper.startX = centerX;
            keeper.startY = goal.y + goal.h - 30;
            if (keeper.state === 'idle') {
                keeper.x = keeper.startX;
                keeper.y = keeper.startY;
            }
        }

        window.addEventListener('resize', resize);
        resize();

        // --- Fullscreen Logic ---
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                // Enter Fullscreen
                if (gameWindow.requestFullscreen) {
                    gameWindow.requestFullscreen();
                } else if (gameWindow.webkitRequestFullscreen) { /* Safari */
                    gameWindow.webkitRequestFullscreen();
                } else if (gameWindow.msRequestFullscreen) { /* IE11 */
                    gameWindow.msRequestFullscreen();
                }
            } else {
                // Exit Fullscreen
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { /* Safari */
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) { /* IE11 */
                    document.msExitFullscreen();
                }
            }
        });

        // Listen for fullscreen change to update canvas and button icon
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        document.addEventListener('msfullscreenchange', handleFullscreenChange);

        function handleFullscreenChange() {
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            
            if (isFullscreen) {
                // Change icon to compress
                fullscreenBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path></svg>`;
            } else {
                // Change icon to expand
                fullscreenBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>`;
            }

            // Small delay to allow CSS to apply before recalculating canvas size
            setTimeout(resize, 100);
        }

        // --- Math Helpers ---
        function getPerpendicularDistance(p, a, b) {
            let dx = b.x - a.x;
            let dy = b.y - a.y;
            let mag = Math.sqrt(dx * dx + dy * dy);
            if (mag === 0) return 0;
            return Math.abs((dy * p.x) - (dx * p.y) + (b.x * a.y) - (b.y * a.x)) / mag;
        }

        function getBezierPoint(t, p0, p1, p2) {
            let mt = 1 - t;
            let x = mt * mt * p0.x + 2 * mt * t * p1.x + t * t * p2.x;
            let y = mt * mt * p0.y + 2 * mt * t * p1.y + t * t * p2.y;
            return { x, y };
        }

        // --- Drawing Functions ---
        function drawBackground() {
            const skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.3);
            skyGrad.addColorStop(0, '#050a15');
            skyGrad.addColorStop(1, '#1a2538');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, width, height * 0.3);

            ctx.fillStyle = '#0a1220';
            ctx.fillRect(0, height * 0.15, width, height * 0.2);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            for(let i=0; i<150; i++) {
                let rx = Math.random() * width;
                let ry = height * 0.15 + Math.random() * (height * 0.2);
                ctx.fillRect(rx, ry, 2, 2);
            }

            const grassGrad = ctx.createLinearGradient(0, height * 0.3, 0, height);
            grassGrad.addColorStop(0, '#195219');
            grassGrad.addColorStop(1, '#277527');
            ctx.fillStyle = grassGrad;
            ctx.fillRect(0, height * 0.3, width, height * 0.7);

            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for(let i=0; i<10; i++) {
                let y = height * 0.3 + (i * (height * 0.7 / 10));
                let h = (height * 0.7 / 10);
                if (i % 2 === 0) {
                    ctx.fillRect(0, y, width, h);
                }
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(width * 0.1, height * 0.4);
            ctx.lineTo(width * 0.9, height * 0.4);
            ctx.moveTo(width * 0.1, height * 0.4);
            ctx.lineTo(width * -0.2, height);
            ctx.moveTo(width * 0.9, height * 0.4);
            ctx.lineTo(width * 1.2, height);
            ctx.stroke();
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.beginPath();
            ctx.ellipse(centerX, height * 0.82, 15, 5, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawGoal() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.fillRect(goal.x, goal.y, goal.w, goal.h);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 1;
            
            for (let i = 0; i <= goal.w; i += 15) {
                ctx.beginPath();
                ctx.moveTo(goal.x + i, goal.y);
                ctx.lineTo(goal.x + i, goal.y + goal.h);
                ctx.stroke();
            }
            for (let i = 0; i <= goal.h; i += 15) {
                ctx.beginPath();
                ctx.moveTo(goal.x, goal.y + i);
                ctx.lineTo(goal.x + goal.w, goal.y + i);
                ctx.stroke();
            }

            ctx.fillStyle = '#fff';
            ctx.shadowColor = 'rgba(255,255,255,0.5)';
            ctx.shadowBlur = 10;
            
            ctx.fillRect(goal.x - goal.postWidth/2, goal.y, goal.postWidth, goal.h);
            ctx.fillRect(goal.x + goal.w - goal.postWidth/2, goal.y, goal.postWidth, goal.h);
            ctx.fillRect(goal.x - goal.postWidth/2, goal.y - goal.postWidth/2, goal.w + goal.postWidth, goal.postWidth);
            
            ctx.shadowBlur = 0;
        }

        function drawKeeper() {
            ctx.save();
            ctx.translate(keeper.x, keeper.y);

            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.ellipse(0, 5, 25, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            let legAngle = 0;
            let armAngle = 0;
            
            if (keeper.state === 'diving') {
                if (keeper.diveDir === -1) { 
                    legAngle = -Math.PI / 4; armAngle = -Math.PI / 2; ctx.rotate(-Math.PI / 6);
                } else if (keeper.diveDir === 1) { 
                    legAngle = Math.PI / 4; armAngle = Math.PI / 2; ctx.rotate(Math.PI / 6);
                } else { 
                    ctx.scale(1, 1.2);
                }
            }

            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            
            ctx.beginPath(); ctx.moveTo(-8, -20); ctx.lineTo(-8 + Math.sin(legAngle) * 20, 0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(8, -20); ctx.lineTo(8 - Math.sin(legAngle) * 20, 0); ctx.stroke();

            ctx.fillStyle = '#2ecc71';
            ctx.beginPath(); ctx.roundRect(-15, -60, 30, 40, 5); ctx.fill();
            
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('1', 0, -35);

            ctx.fillStyle = '#ffccaa';
            ctx.beginPath(); ctx.arc(0, -70, 10, 0, Math.PI * 2); ctx.fill();
            
            ctx.fillStyle = '#4a2c12';
            ctx.beginPath(); ctx.arc(0, -72, 10, Math.PI, 0); ctx.fill();

            ctx.strokeStyle = '#2ecc71';
            ctx.lineWidth = 8;
            
            ctx.beginPath();
            ctx.moveTo(-12, -50);
            let lx = -12 - Math.cos(armAngle) * 25;
            let ly = -50 - Math.sin(armAngle) * 25;
            ctx.lineTo(lx, ly);
            ctx.stroke();
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath(); ctx.arc(lx, ly, 6, 0, Math.PI*2); ctx.fill();

            ctx.beginPath();
            ctx.moveTo(12, -50);
            let rx = 12 + Math.cos(armAngle) * 25;
            let ry = -50 - Math.sin(armAngle) * 25;
            ctx.lineTo(rx, ry);
            ctx.stroke();
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath(); ctx.arc(rx, ry, 6, 0, Math.PI*2); ctx.fill();

            ctx.restore();
        }

        function drawPlayer() {
            let px = centerX - 60;
            let py = height * 0.88;

            ctx.save();
            ctx.translate(px, py);

            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath(); ctx.ellipse(20, 10, 40, 12, 0, 0, Math.PI * 2); ctx.fill();

            ctx.strokeStyle = '#1c2e4a'; ctx.lineWidth = 14; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(10, -40); ctx.lineTo(30, -5); ctx.stroke();
            
            ctx.strokeStyle = '#ffccaa'; ctx.lineWidth = 10;
            ctx.beginPath(); ctx.moveTo(5, -90); ctx.lineTo(-15, -60); ctx.stroke();

            ctx.fillStyle = '#1c4b9a'; 
            ctx.beginPath(); ctx.roundRect(-15, -110, 35, 70, 8); ctx.fill();
            
            ctx.fillStyle = '#fff'; ctx.font = 'bold 28px Arial'; ctx.textAlign = 'center';
            ctx.fillText('10', 2, -70);

            ctx.strokeStyle = '#1c2e4a'; ctx.lineWidth = 16;
            ctx.beginPath(); ctx.moveTo(0, -40); ctx.lineTo(-15, -15); ctx.lineTo(5, -5); ctx.stroke();
            
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 14;
            ctx.beginPath(); ctx.moveTo(-10, -20); ctx.lineTo(5, -5); ctx.stroke();

            ctx.fillStyle = '#ffccaa'; ctx.beginPath(); ctx.arc(10, -125, 14, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#2a1b12'; ctx.beginPath(); ctx.arc(10, -128, 14, Math.PI, 0); ctx.fill();

            ctx.restore();
        }

        function drawAimTrail() {
            if (dragPath.length < 2 || gameState === 'result') return;

            ctx.save();
            
            let dist = Math.sqrt(Math.pow(dragPath[dragPath.length-1].x - dragPath[0].x, 2) + Math.pow(dragPath[dragPath.length-1].y - dragPath[0].y, 2));
            let powerRatio = Math.min(dist / 300, 1);
            
            let traceColor = `rgba(255, ${255 - powerRatio * 200}, 0, 0.8)`;

            ctx.beginPath();
            ctx.moveTo(dragPath[0].x, dragPath[0].y);
            
            for (let i = 1; i < dragPath.length; i++) {
                ctx.lineTo(dragPath[i].x, dragPath[i].y);
            }

            ctx.strokeStyle = traceColor;
            ctx.lineWidth = 4 + powerRatio * 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            ctx.shadowColor = traceColor;
            ctx.shadowBlur = 15;
            
            ctx.stroke();
            ctx.restore();

            if (isDragging) {
                ctx.beginPath();
                ctx.arc(dragPath[dragPath.length-1].x, dragPath[dragPath.length-1].y, 10, 0, Math.PI*2);
                ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function drawBall() {
            if (!ball.active && gameState === 'result') return;

            ctx.save();
            ctx.translate(ball.currentX, ball.currentY);

            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            let shadowScale = ball.scale;
            ctx.ellipse(0, 15 * shadowScale, 15 * shadowScale, 5 * shadowScale, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.scale(ball.scale, ball.scale);
            ctx.rotate(ball.spin);

            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI*2); ctx.fill();
            
            for(let i=0; i<5; i++) {
                let angle = (i * Math.PI * 2) / 5;
                let x = Math.cos(angle) * 8;
                let y = Math.sin(angle) * 8;
                ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
            }

            ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(-4, -4, 4, 0, Math.PI*2); ctx.fill();

            ctx.restore();
        }

        // --- Game Logic ---
        function startKick() {
            if (dragPath.length < 3) return; 

            gameState = 'shooting';
            ball.active = true;
            ball.progress = 0;

            let start = dragPath[0];
            let end = dragPath[dragPath.length - 1];

            let dx = end.x - start.x;
            let dy = end.y - start.y;
            let distance = Math.sqrt(dx*dx + dy*dy);
            
            let maxDist = 300; 
            let powerRatio = Math.min(distance / maxDist, 1);
            ball.speed = 0.015 + (powerRatio * 0.025);

            let maxDeviation = 0;
            let controlPoint = { x: (start.x + end.x) / 2, y: (start.y + end.y) / 2 }; 

            for (let i = 0; i < dragPath.length; i++) {
                let p = dragPath[i];
                let distToLine = getPerpendicularDistance(p, start, end);
                if (distToLine > maxDeviation) {
                    maxDeviation = distToLine;
                    controlPoint = p;
                }
            }

            if (maxDeviation < 10) {
                controlPoint = { x: (start.x + end.x) / 2, y: (start.y + end.y) / 2 };
            }

            ball.startX = start.x; ball.startY = start.y;
            ball.endX = end.x; ball.endY = end.y;
            ball.controlX = controlPoint.x; ball.controlY = controlPoint.y;

            keeper.state = 'diving';
            let keeperTargetX = ball.endX + (Math.random() - 0.5) * 120; 
            
            keeperTargetX = Math.max(goal.x + 20, Math.min(goal.x + goal.w - 20, keeperTargetX));

            if (keeperTargetX < keeper.startX - 30) keeper.diveDir = -1;
            else if (keeperTargetX > keeper.startX + 30) keeper.diveDir = 1;
            else keeper.diveDir = 0;

            keeper.targetX = keeperTargetX;
            keeper.targetY = keeper.startY - (keeper.diveDir === 0 ? 40 : 10); 
        }

        function resolveShot() {
            gameState = 'result';
            dragPath = [];

            let inGoalX = ball.endX > goal.x + 10 && ball.endX < goal.x + goal.w - 10;
            let inGoalY = ball.endY > goal.y && ball.endY < goal.y + goal.h;

            let keeperSaveX = keeper.x; 
            let keeperSaveY = keeper.y - 30; 

            let dx = Math.abs(ball.endX - keeperSaveX);
            let dy = Math.abs(ball.endY - keeperSaveY);
            
            let isSaved = (dx < 40 && dy < 50); 

            if (inGoalX && inGoalY && !isSaved) {
                goals++; playerScore++;
                goalCountEl.innerText = goals; playerScoreEl.innerText = playerScore;
                showMessage("GOAL!", "#2ecc71");
                setTimeout(() => { ball.active = false; }, 500);
            } else {
                if (inGoalX && inGoalY && isSaved) {
                    showMessage("SAVED!", "#f1c40f");
                } else {
                    showMessage("MISS!", "#e74c3c");
                }
                misses++; oppScore++;
                missCountEl.innerText = misses; oppScoreEl.innerText = oppScore;
            }

            setTimeout(resetGame, 2000);
        }

        function showMessage(text, color) {
            msgOverlay.innerText = text;
            msgOverlay.style.color = color;
            msgOverlay.classList.add('show');
        }

        function resetGame() {
            msgOverlay.classList.remove('show');
            gameState = 'aiming';
            
            ball.currentX = ball.startX; ball.currentY = ball.startY;
            ball.scale = 1; ball.spin = 0; ball.active = true; ball.progress = 0;
            
            keeper.state = 'idle'; keeper.x = keeper.startX; keeper.y = keeper.startY;
            dragPath = [];
        }

        function update() {
            if (gameState === 'shooting' && ball.active) {
                ball.progress += ball.speed;
                
                if (ball.progress >= 1) {
                    ball.progress = 1;
                    ball.active = false;
                    resolveShot();
                }

                let pos = getBezierPoint(ball.progress, 
                    {x: ball.startX, y: ball.startY}, 
                    {x: ball.controlX, y: ball.controlY}, 
                    {x: ball.endX, y: ball.endY}
                );
                
                ball.currentX = pos.x;
                ball.currentY = pos.y;
                ball.scale = 1 - (0.7 * ball.progress); 
                ball.spin += 0.3;

                if (ball.progress > 0.15) {
                    let kt = (ball.progress - 0.15) / 0.85; 
                    kt = Math.min(kt, 1);
                    let kEase = 1 - Math.pow(1 - kt, 3); 
                    keeper.x = keeper.startX + (keeper.targetX - keeper.startX) * kEase;
                    keeper.y = keeper.startY + (keeper.targetY - keeper.startY) * kEase;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            drawBackground();
            drawGoal();
            drawKeeper();
            drawPlayer();
            drawAimTrail(); 
            drawBall(); 
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // --- Unified Input Handling ---
        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else if (e.changedTouches && e.changedTouches.length > 0) {
                clientX = e.changedTouches[0].clientX;
                clientY = e.changedTouches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function handlePointerDown(e) {
            if (gameState !== 'aiming') return;
            
            const pos = getPointerPos(e);
            
            let distToBall = Math.sqrt(Math.pow(pos.x - ball.startX, 2) + Math.pow(pos.y - ball.startY, 2));
            
            if (distToBall < 120) { 
                isDragging = true;
                dragPath = [{x: ball.startX, y: ball.startY}]; 
                if(e.type === 'touchstart') e.preventDefault(); 
            }
        }

        function handlePointerMove(e) {
            if (!isDragging) return;
            if(e.type === 'touchmove') e.preventDefault(); 

            const pos = getPointerPos(e);
            
            let lastPoint = dragPath[dragPath.length - 1];
            let dist = Math.sqrt(Math.pow(pos.x - lastPoint.x, 2) + Math.pow(pos.y - lastPoint.y, 2));
            
            if (dist > 2) { 
                if (pos.y < lastPoint.y || pos.y < ball.startY) {
                    dragPath.push({x: pos.x, y: pos.y});
                }
            }
        }

        function handlePointerUp(e) {
            if (isDragging) {
                isDragging = false;
                if(e.type === 'touchend' || e.type === 'touchcancel') e.preventDefault();
                startKick();
            }
        }

        // Mouse Events
        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        canvas.addEventListener('mouseup', handlePointerUp);
        canvas.addEventListener('mouseleave', () => { isDragging = false; dragPath = []; });

        // Touch Events
        canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
        canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
        canvas.addEventListener('touchend', handlePointerUp, { passive: false });
        canvas.addEventListener('touchcancel', handlePointerUp, { passive: false });

        // Init
        resetGame();
        loop();

    </script>
</body>
