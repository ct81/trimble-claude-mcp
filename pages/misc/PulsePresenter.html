<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Face Presenter</title>
<style>
:root{--bg:#eef1f7;--panel:#fff;--text:#1b2030;--muted:#5b6478;--accent:#5b6cff;--line:#d9deea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131c;--panel:#1a1f2d;--text:#eef1f8;--muted:#98a2ba;--accent:#8793ff;--line:#2b3246}}
:root[data-theme="dark"]{--bg:#10131c;--panel:#1a1f2d;--text:#eef1f8;--muted:#98a2ba;--accent:#8793ff;--line:#2b3246}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;position:relative}
canvas{display:block;width:100%;height:100%}
#caption{position:absolute;left:12px;right:12px;bottom:10px;text-align:center;font-size:1rem;line-height:1.35;color:var(--text);background:color-mix(in srgb,var(--panel) 80%,transparent);border-radius:12px;padding:8px 12px;min-height:1.35em;display:none}
#ui{background:var(--panel);border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
textarea{width:100%;box-sizing:border-box;height:84px;resize:none;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--text)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:8px 14px;cursor:pointer}
button.on{border-color:var(--accent);color:var(--accent)}
button.go{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.sp{flex:1}
select{font:inherit;flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:var(--bg);color:var(--text)}
[hidden]{display:none!important}
#ui{max-height:52vh;overflow:auto}
details{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
summary{cursor:pointer;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
label{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
label select{border-radius:10px;padding:6px 8px}
input[type=color]{width:100%;height:34px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
#perm{display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center}
#perm .row{justify-content:center}
.box.asking .vwrap,.box.asking #smsg,.box.asking #camrow{display:none}
.box:not(.asking) #perm{display:none}
#scan{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.box{background:var(--panel);border-radius:16px;padding:12px;width:min(92vw,400px);max-height:94%;display:flex;flex-direction:column;gap:10px;overflow:auto}
.vwrap{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:12px;background:#000;max-height:60vh;margin:0 auto;width:100%}
#vid{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.oval{position:absolute;left:50%;top:45%;width:56%;height:66%;transform:translate(-50%,-50%);border:3px dashed #fff;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
small{color:var(--muted)}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas><div id="caption"></div></div>
<div id="ui">
  <textarea id="txt">Hello! I’m your 3D presenter. Move your pointer and I’ll follow you with my eyes. Give me any script, and I’ll present it for you.</textarea>
  <details id="cust"><summary>🎨 Customize look</summary>
    <div class="grid">
      <label>Face shape<select id="o-shape"><option value="oval">Oval</option><option value="round">Round</option><option value="long">Long</option><option value="square">Square jaw</option></select></label>
      <label>Hair style<select id="o-hair"><option value="short">Short</option><option value="buzz">Buzz cut</option><option value="long">Long</option><option value="curly">Curly / afro</option><option value="bald">Bald</option></select></label>
      <label>Hair color<input type="color" id="o-hc" value="#2f2420"></label>
      <label>Skin tone<input type="color" id="o-sk" value="#e9b894"></label>
      <label>Eye color<input type="color" id="o-ec" value="#3b2417"></label>
      <label>Facial hair color<input type="color" id="o-fc" value="#2f2420"></label>
      <label>Moustache<select id="o-mo"><option value="none">None</option><option value="reg">Regular</option><option value="thick">Thick</option></select></label>
      <label>Beard<select id="o-be"><option value="none">None</option><option value="goatee">Goatee</option><option value="full">Full beard</option></select></label>
      <label>Glasses<select id="o-gl"><option value="none">None</option><option value="round">Round</option><option value="square">Square</option></select></label>
      <label>Mole<select id="o-ml"><option value="none">None</option><option value="cl">Cheek, screen-left</option><option value="cr">Cheek, screen-right</option><option value="chin">Chin</option><option value="lip">Above lip</option><option value="fore">Forehead</option><option value="eye">Beside eye</option><option value="scan">From scan</option></select></label>
    </div>
  </details>
  <div class="row">
    <button data-g="female" class="on">♀ Female</button>
    <button data-g="male">♂ Male</button>
    <button data-g="all">All voices</button>
    <select id="vsel" aria-label="Voice"></select>
  </div>
  <div class="row">
    <button class="go" id="speak">▶ Present</button>
    <button id="stop">■ Stop</button>
    <button id="ex">{ } JSON example</button>
    <button id="scanbtn">📷 Scan my face</button>
    <span class="sp"></span>
    <button data-e="neutral" class="on">Neutral</button>
    <button data-e="happy">Happy</button>
    <button data-e="surprised">Surprised</button>
    <button data-e="serious">Serious</button>
  </div>
  <small id="note">Paste plain text or a JSON script (array or {"script":[…]}) with text, expression, gender (male/female), voice (name), rate, pitch and pause (ms) per step.</small>
</div>
<div id="scan" hidden>
  <div class="box">
    <div id="perm">
      <div style="font-size:2.2rem">📷</div>
      <b>Allow camera access?</b>
      <small id="permmsg"></small>
      <div class="row"><button class="go" id="allow">Allow camera</button><button id="pick2">Upload photo</button><button id="later">Not now</button></div>
    </div>
    <div class="vwrap"><video id="vid" playsinline muted></video><canvas id="ov" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas><div class="oval"></div></div>
    <small id="smsg">Center your face in the oval, in even light.</small>
    <div class="row" id="camrow">
      <button class="go" id="captureBtn" disabled>Capture</button>
      <button id="pick">Upload photo</button>
      <button id="reset">Reset look</button>
      <button id="cls">Cancel</button>
    </div>
    <input type="file" id="file" accept="image/*" capture="user" hidden>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/tracking-min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/data/face-min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/data/eye-min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/clmtrackr@1.1.2/build/clmtrackr.min.js"></script>
<script>
const canvas=document.getElementById('c'),stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(32,1,0.1,50);cam.position.set(0,0.1,6.2);
scene.add(new THREE.HemisphereLight(0xffffff,0x667799,0.9));
const key=new THREE.DirectionalLight(0xffffff,0.9);key.position.set(2,3,4);scene.add(key);
const rim=new THREE.DirectionalLight(0x88aaff,0.5);rim.position.set(-3,1,-2);scene.add(rim);

const M=(c,r=0.6)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const skin=M(0xf1c3a0,0.7),dark=M(0x2a1a1a,0.5),white=M(0xffffff,0.3),hair=M(0x3a2a22,0.8),shirt=M(0x5b6cff,0.8);

const rig=new THREE.Group();scene.add(rig);
// body
const body=new THREE.Mesh(new THREE.SphereGeometry(1,32,24),shirt);body.scale.set(1.7,0.9,0.9);body.position.set(0,-2.1,0);scene.add(body);
const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.36,0.8,20),skin);neck.position.y=-1.2;scene.add(neck);
// head
const head=new THREE.Group();scene.add(head);
const skull=new THREE.Mesh(new THREE.SphereGeometry(1,48,36),skin);skull.scale.set(0.9,1.1,0.95);head.add(skull);
const cap=new THREE.Mesh(new THREE.SphereGeometry(1,40,24,0,Math.PI*2,0,Math.PI*0.48),hair);cap.scale.set(0.95,1.15,1.0);cap.rotation.x=-0.35;cap.position.y=0.04;head.add(cap);
[-1,1].forEach(s=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.16,16,12),skin);e.scale.set(0.5,1,0.8);e.position.set(s*0.9,0,0);head.add(e)});
const nose=new THREE.Mesh(new THREE.SphereGeometry(0.13,20,16),skin);nose.scale.set(0.85,1.1,1.1);nose.position.set(0,-0.12,0.93);head.add(nose);
const hairLong=new THREE.Mesh(new THREE.SphereGeometry(1,32,24),hair);hairLong.scale.set(1.02,1.3,0.8);hairLong.position.set(0,-0.2,-0.2);head.add(hairLong);
// eyes
const eyes=[],pupils=[],brows=[];
[-1,1].forEach(s=>{
  const g=new THREE.Group();g.position.set(s*0.33,0.15,0.8);
  const w=new THREE.Mesh(new THREE.SphereGeometry(0.14,24,16),white);w.scale.z=0.6;g.add(w);
  const p=new THREE.Mesh(new THREE.SphereGeometry(0.07,16,12),dark);p.position.z=0.07;g.add(p);
  head.add(g);eyes.push(g);pupils.push(p);
  const b=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.05,0.06),hair);b.position.set(s*0.33,0.42,0.84);head.add(b);brows.push(b);
});
// mouth
const mouth=new THREE.Group();mouth.position.set(0,-0.5,0.85);head.add(mouth);
const lipMat=M(0xb5524f,0.55);
const hole=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),M(0x3d0e12,0.6));mouth.add(hole);
const tongue=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),M(0xd9696f,0.6));mouth.add(tongue);
const teeth=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),white);mouth.add(teeth);
const lip=new THREE.Mesh(new THREE.TorusGeometry(0.2,0.032,10,28,Math.PI),lipMat);mouth.add(lip);
const lip2=new THREE.Mesh(new THREE.TorusGeometry(0.2,0.034,10,28,Math.PI),lipMat);mouth.add(lip2);
const cheeks=[-1,1].map(s=>{const c=new THREE.Mesh(new THREE.SphereGeometry(0.12,16,12),new THREE.MeshStandardMaterial({color:0xff7f8a,roughness:0.9,transparent:true,opacity:0}));c.scale.set(1,0.7,0.3);c.position.set(s*0.5,-0.22,0.76);head.add(c);return c});

// state
const EX={neutral:{smile:0.3,brow:0,wide:1,w:1,jaw:0,squint:0,tilt:0,blush:0},happy:{smile:0.95,brow:0.05,wide:1,w:1.15,jaw:0.12,squint:0.22,tilt:0,blush:0.6},surprised:{smile:-0.1,brow:0.15,wide:1.35,w:0.7,jaw:0.55,squint:0,tilt:0,blush:0},serious:{smile:-0.25,brow:-0.04,wide:0.9,w:0.95,jaw:0,squint:0.12,tilt:0.28,blush:0}};
let vt=0,vtNext=0,vw=1;
let cur={...EX.neutral},tgt=EX.neutral,open=0,pulse=0,speaking=false,look={x:0,y:0},lookT={x:0,y:0},blink=0,nextBlink=2;
addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();lookT.x=((e.clientX-r.left)/r.width-0.5)*2;lookT.y=((e.clientY-r.top)/r.height-0.5)*2});
document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-e]').forEach(x=>x.classList.remove('on'));b.classList.add('on');tgt=EX[b.dataset.e]});

// speech
const txt=document.getElementById('txt'),capEl=document.getElementById('caption'),note=document.getElementById('note');
let queue=[],run=0;
function setExpr(n){if(!EX[n])return;tgt=EX[n];document.querySelectorAll('[data-e]').forEach(x=>x.classList.toggle('on',x.dataset.e===n))}
function parseScript(raw){
  const s=raw.trim();
  if(s[0]==='['||s[0]==='{'){
    let d=JSON.parse(s);
    if(!Array.isArray(d))d=d.script||d.steps||d.lines;
    if(!Array.isArray(d))throw new Error('expected an array or a "script" array');
    return d.map(x=>typeof x==='string'?{text:x}:{text:x.text||x.say||'',expression:x.expression,rate:x.rate,pitch:x.pitch,pause:x.pause,voice:x.voice,gender:x.gender});
  }
  return (s.match(/[^.!?]+[.!?]*/g)||[]).map(x=>({text:x.trim()})).filter(x=>x.text);
}
const vsel=document.getElementById('vsel');let voices=[],gender='female';
const FEM=/\b(female|woman|samantha|victoria|karen|moira|tessa|fiona|zira|susan|hazel|aria|jenny|emma|libby|sonia|allison|ava|serena|kate|joanna|salli|kimberly|ivy|amy|nicole|catherine|tracy|paulina|monica|luciana|amelie|marie|anna|ana|helena|sabina|milena|laura|elsa|michelle|natasha|clara|sara|lucia|paola|alice|ioana|zosia|yelda|kyoko|nora|vicki|veena|ellen|sandy|shelley|flo|grandma|zuzana|kanya|damayanti|lekha|samira|lana|karina|joana|catarina|carmit|alva|satu|melina|nicky)\b/i;
const MALE=/\b(male|man|daniel|alex|fred|tom|oliver|david|mark|george|james|ryan|guy|matthew|joey|justin|kevin|brian|russell|arthur|aaron|gordon|rishi|jorge|diego|thomas|luca|markus|ravi|hemant|stefan|jacques|yuri|lee|henry|nathan|eric|bruce|ralph|junior|albert|reed|rocko|eddy|grandpa|xander|maged|mikhail|magnus|juan|felipe|filip|yannick|cem|mehmet|henrik|ioan)\b/i;
const genderOf=v=>FEM.test(v.name)?'female':MALE.test(v.name)?'male':'other';
const selVoice=()=>vsel.value===''?null:voices[+vsel.value]||null;
function refreshVoices(){
  if(!('speechSynthesis' in window))return;
  voices=speechSynthesis.getVoices();
  const lang=(navigator.language||'en').slice(0,2),prev=vsel.value;
  const list=voices.map((v,i)=>({v,i})).filter(o=>gender==='all'||genderOf(o.v)===gender)
    .sort((a,b)=>(b.v.lang.startsWith(lang)-a.v.lang.startsWith(lang))||a.v.name.localeCompare(b.v.name));
  vsel.innerHTML=list.length?'':'<option value="">Default voice (pitch-adjusted)</option>';
  list.forEach(o=>{const op=document.createElement('option');op.value=o.i;op.textContent=o.v.name+' ('+o.v.lang+')';vsel.appendChild(op)});
  if(prev&&[...vsel.options].some(o=>o.value===prev))vsel.value=prev;
}
function styleAvatar(g){
  const f=g==='female';
  shirt.color.set(f?0xd6528a:0x5b6cff);
  brows.forEach(b=>b.scale.set(1,f?0.7:1.4,1));
  if(!scan){O.hair.value=f?'long':'short';O.hc.value=f?'#5a3524':'#2f2420';O.fc.value=O.hc.value;O.sk.value=f?'#f3c9ab':'#e9b894'}
  applyLook();
}
function setGender(g){
  gender=g;
  document.querySelectorAll('[data-g]').forEach(x=>x.classList.toggle('on',x.dataset.g===g));
  if(g!=='all')styleAvatar(g);
  refreshVoices();
}
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>setGender(b.dataset.g));
vsel.onchange=()=>{const v=selVoice();if(v){const g=genderOf(v);if(g!=='other')styleAvatar(g)}};
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=refreshVoices;
let mouthY=-0.5,browY=0.42,scan=null,stream=null,mScale=1,liveT=null,liveRAF=0,liveBuf=[];
function applyScan(){
  if(!scan)return;
  const hx=a=>'#'+a.map(v=>Math.round(Math.min(1,Math.max(0,v))*255).toString(16).padStart(2,'0')).join('');
  O.sk.value=hx(scan.skin);
  if(scan.hc)O.hc.value=hx(scan.hc);
  O.fc.value=scan.fc?hx(scan.fc):O.hc.value;
  if(scan.shirt)shirt.color.setRGB(...scan.shirt);
  if(scan.mole)ML.scan=scan.mole;
  for(const k of ['shape','hair','mo','be','ml','gl'])if(scan[k])O[k].value=scan[k];
}
const scanEl=document.getElementById('scan'),vid=document.getElementById('vid'),smsg=document.getElementById('smsg'),fileIn=document.getElementById('file');
function closeScan(){scanEl.hidden=true;stopLive();if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}vid.srcObject=null;captureBtn.disabled=true}
document.getElementById('cls').onclick=closeScan;
const box=scanEl.querySelector('.box'),permMsg=document.getElementById('permmsg');
const DEF='To scan your face, this page needs to use your camera. Your browser will ask for permission next. Photos stay on your device and are never uploaded.';
const BLOCKED='Camera access is blocked. Click the camera or lock icon in your browser’s address bar, set Camera to Allow, then press Allow camera again. If this page is embedded, it may not be permitted to use the camera, so you can upload a photo instead.';
const captureBtn=document.getElementById('captureBtn');
async function startCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    box.classList.add('asking');
    permMsg.textContent='This browser can’t open the camera here. Open this page over HTTPS (or localhost), or upload a photo instead.';
    return;
  }
  captureBtn.disabled=true;
  permMsg.textContent='Waiting for you to allow the camera in the browser prompt…';
  try{
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:960}},audio:false});
    vid.srcObject=stream;
    await vid.play();
    if(!vid.videoWidth||!vid.videoHeight) throw new Error('Camera started but no video frames are available yet.');
    box.classList.remove('asking');
    captureBtn.disabled=false;
    smsg.textContent='Center your face in the oval, in even light.';
    startLive();
  }catch(e){
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
    vid.srcObject=null;
    captureBtn.disabled=true;
    box.classList.add('asking');
    permMsg.textContent=(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))?BLOCKED:
      (e&&e.name==='NotFoundError')?'No camera was found on this device. You can upload a photo instead.':
      (e&&e.name==='NotReadableError')?'The camera is busy or unavailable. Close other apps using it, then try again, or upload a photo.':
      'The camera could not be started. Check browser camera permission and try again, or upload a photo instead.';
  }
}
document.getElementById('allow').onclick=startCam;
document.getElementById('later').onclick=closeScan;
document.getElementById('scanbtn').onclick=async()=>{
  scanEl.hidden=false;box.classList.add('asking');permMsg.textContent=DEF;
  let st='prompt';try{st=(await navigator.permissions.query({name:'camera'})).state}catch(e){}
  if(st==='granted')startCam();else if(st==='denied')permMsg.textContent=BLOCKED;
};
document.getElementById('pick').onclick=document.getElementById('pick2').onclick=()=>fileIn.click();
document.getElementById('reset').onclick=()=>{
  scan=null;fx=1;mScale=1;nose.scale.x=0.85;mouthY=-0.5;browY=0.42;O.shape.value='oval';O.mo.value='none';O.be.value='none';O.gl.value='none';O.ml.value='none';
  eyes.forEach((g,i)=>g.position.x=(i?1:-1)*0.33);brows.forEach((b,i)=>b.position.x=(i?1:-1)*0.33);
  styleAvatar(hairLong.visible?'female':'male');note.textContent='Look reset to the default face.';closeScan();
};
fileIn.onchange=()=>{const f=fileIn.files[0];if(!f)return;const im=new Image();im.onload=()=>process(im,im.naturalWidth,im.naturalHeight);im.src=URL.createObjectURL(f)};
document.getElementById('captureBtn').onclick=()=>{if(!vid.videoWidth||!vid.videoHeight){smsg.textContent='The camera is not ready yet. Wait a moment, or restart the camera.';captureBtn.disabled=true;return}process(vid,vid.videoWidth,vid.videoHeight)};
const ov=document.getElementById('ov'),ovc=ov.getContext('2d');
function startLive(){
  if(!window.clm)return;
  try{liveT=new clm.tracker();liveT.init();vid.width=vid.videoWidth;vid.height=vid.videoHeight;liveT.start(vid)}catch(e){liveT=null;return}
  liveBuf=[];
  const loop=()=>{
    liveRAF=requestAnimationFrame(loop);
    const bw=ov.clientWidth,bh=ov.clientHeight;if(ov.width!==bw){ov.width=bw;ov.height=bh}
    ovc.clearRect(0,0,bw,bh);
    const p=liveT&&liveT.getCurrentPosition(),s=liveT?liveT.getScore():0;
    if(p&&s>0.4){
      const vw=vid.videoWidth,vh=vid.videoHeight,k=Math.max(bw/vw,bh/vh),ox=(bw-vw*k)/2,oy=(bh-vh*k)/2;
      ovc.fillStyle=s>0.55?'#4cf2a0':'#ffd24c';
      p.forEach(q=>{ovc.beginPath();ovc.arc(bw-(q[0]*k+ox),q[1]*k+oy,2.2,0,6.3);ovc.fill()});
      if(s>0.5){liveBuf.push(p.map(a=>[a[0],a[1]]));if(liveBuf.length>6)liveBuf.shift()}
      smsg.textContent=s>0.55?'Face locked. Hold still, then press Capture.':'Tracking… keep your face in the oval and look straight ahead.';
    }else{smsg.textContent='Looking for your face… make sure it’s well lit.';liveBuf=[]}
  };
  loop();
}

  if(!('speechSynthesis' in window)){note.textContent='Speech isn’t supported in this browser.';return}
  stop();const id=run;
  try{queue=parseScript(txt.value)}catch(e){note.textContent='Invalid JSON script: '+e.message;return}
  speakNext(id);
};

function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.fov=w/h<0.8?44:32;cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);resize();

const clock=new THREE.Clock();
function tick(){
  const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime,k=1-Math.pow(0.001,dt);
  for(const key in cur)cur[key]+=(tgt[key]-cur[key])*k*0.6;
  look.x+=(lookT.x-look.x)*k*0.5;look.y+=(lookT.y-look.y)*k*0.5;
  // mouth + talking expression
  pulse*=Math.pow(0.03,dt);
  vtNext-=dt;
  if(vtNext<0){vtNext=0.07+Math.random()*0.08;const r=Math.random();vt=r<0.14?0.03:0.25+Math.random()*0.75;vw=0.75+Math.random()*0.6}
  const talk=speaking?Math.min(1,vt*(0.7+0.3*Math.abs(Math.sin(t*9)))+0.5*pulse):0;
  open+=(talk-open)*Math.min(1,dt*22);
  const o=Math.min(1,Math.max(open,cur.jaw));
  const sm=cur.smile+(speaking?0.18*Math.sin(t*1.9)+0.12*pulse:0);
  const gap=o*0.2,mw=cur.w*mScale*(speaking?(1.05-0.3*o+0.25*(vw-1)):1);
  hole.scale.set(0.19*mw,Math.max(0.004,gap/2),0.045);hole.position.set(0,-gap/2,-0.01);
  teeth.scale.set(0.26*mw,Math.min(0.05,gap*0.5),0.02);teeth.position.set(0,-Math.min(0.025,gap*0.25)-0.002,0.04);teeth.visible=gap>0.03;
  tongue.scale.set(0.11*mw,Math.max(0.003,gap*0.22),0.03);tongue.position.set(0,-gap*0.82,0.03);tongue.visible=gap>0.05;
  lip.scale.set(mw,-sm*0.6+o*0.45,1);lip.position.set(0,0,0.01);
  lip2.visible=gap>0.02;lip2.scale.set(mw*0.95,-(0.3+Math.max(sm,0)*0.4),1);lip2.position.set(0,-gap,0.01);
  mouth.position.y=mouthY-o*0.02;
  cheeks.forEach(c=>c.material.opacity=Math.max(0,cur.blush)*0.5+Math.max(0,sm-0.5)*0.3);
  // blink
  nextBlink-=dt;if(nextBlink<0){blink=1;nextBlink=2+Math.random()*3}
  blink=Math.max(0,blink-dt*7);
  const bl=Math.abs(Math.sin(blink*Math.PI*0.5+0.0001))*(blink>0?1:0);
  eyes.forEach(g=>g.scale.set(cur.wide,Math.max(0.08,cur.wide*(1-bl)*(1-cur.squint)),1));
  pupils.forEach(p=>{p.position.x=look.x*0.05;p.position.y=-look.y*0.04});
  const emph=speaking?0.025*Math.sin(t*3.1)+0.06*pulse:0;
  brows.forEach((b,i)=>{b.position.y=browY+cur.brow+emph;b.rotation.z=(i?1:-1)*cur.tilt});
  // head motion
  head.rotation.y=look.x*0.35+Math.sin(t*0.7)*0.04+(speaking?Math.sin(t*2.1)*0.06:0);
  head.rotation.x=look.y*0.2+Math.sin(t*0.9)*0.02+(speaking?Math.sin(t*3.3)*0.03+pulse*0.07:0);
  head.rotation.z=Math.sin(t*0.5)*0.015;
  body.rotation.y=head.rotation.y*0.25;body.scale.y=0.9+Math.sin(t*1.4)*0.01;
  renderer.render(scene,cam);requestAnimationFrame(tick);
}
tick();
setGender('female');
</script>
</body>
