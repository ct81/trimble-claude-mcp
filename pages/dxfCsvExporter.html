<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DXF → CSV Exporter</title>
<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
<script src="master.js" type="module" defer></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f6f8;
    margin: 0;
    padding: 24px;
    color: #222;
  }
  .container {
    max-width: 1400px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 28px;
  }
  h1 { margin: 0 0 8px; font-size: 24px; }
  .subtitle { color: #666; margin-bottom: 24px; font-size: 14px; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 20px;
    padding: 16px;
    background: #f9fafb;
    border-radius: 8px;
    border: 1px solid #e5e7eb;
  }
  input[type="file"] {
    padding: 8px;
    border: 1px dashed #94a3b8;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    flex: 1;
    min-width: 220px;
  }
  button {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover:not(:disabled) { background: #1d4ed8; }
  button:disabled { background: #cbd5e1; cursor: not-allowed; }
  button.secondary { background: #059669; }
  button.secondary:hover:not(:disabled) { background: #047857; }
  .stats {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    padding: 12px 16px;
    background: #eff6ff;
    border-left: 4px solid #2563eb;
    border-radius: 6px;
    font-size: 14px;
  }
  .stats span b { color: #1e40af; }
  .tableWrap {
    max-height: 600px;
    overflow: auto;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 12px;
    font-family: "SF Mono", Monaco, Consolas, monospace;
  }
  th {
    position: sticky;
    top: 0;
    background: #1e293b;
    color: #fff;
    padding: 8px 10px;
    text-align: left;
    white-space: nowrap;
    z-index: 1;
  }
  td {
    padding: 6px 10px;
    border-bottom: 1px solid #eef2f7;
    white-space: nowrap;
  }
  tr:hover td { background: #f8fafc; }
  .empty { padding: 40px; text-align: center; color: #94a3b8; }
  .err {
    background: #fef2f2;
    color: #991b1b;
    padding: 12px 16px;
    border-left: 4px solid #dc2626;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 14px;
  }
  .manual { background: #fef9c3 !important; }
</style>
</head>
<body>
	<div>
        <input type="hidden" id="hdnProjectDetail" />
        <input type="hidden" id="hdnProjectName" />
        <input type="hidden" id="hdnUserId" />
        <input type="hidden" id="hdnUserEmail" />
        <input type="hidden" id="hdnUserFirstName" />
        <input type="hidden" id="hdnUserLastName" />
        <input type="hidden" id="hdnUserDetail" />
        <input type="hidden" id="hdnAccessTokenDetail" />
        <input type="hidden" id="hdnLicenseJson" />
        <input type="hidden" ID="hdnDefaultModel" />
    </div>
<div class="container">
  <h1>DXF → CSV Converter</h1>
  <div class="subtitle">
    Extracts DXF entities (lines, polylines, circles, arcs, text) into CSV for Tekla Structures modeling.
    <b>Yellow columns</b> (Material, Elevation, GridLine) need manual entry.
  </div>

  <div class="controls">
    <input type="file" id="fileInput" accept=".dxf,.txt" />
    <button id="convertBtn" disabled>Convert &amp; Preview</button>
    <button id="downloadBtn" class="secondary" disabled>Download CSV</button>
  </div>

  <div id="errorBox"></div>
  <div id="stats" class="stats" style="display:none;"></div>
  <div id="tableWrap" class="tableWrap"><div class="empty">No file loaded yet.</div></div>
</div>

<script>
// ============================================================
// 1. DXF PARSER
// ============================================================
function parseDXF(dxfText) {
  const lines = dxfText.split(/\r?\n/);
  const entities = [];
  let i = 0;
  let inEntities = false;

  // Locate ENTITIES section
  while (i + 1 < lines.length) {
    const c = lines[i].trim();
    const v = lines[i + 1].trim();
    i += 2;
    if (c === '0' && v === 'SECTION') {
      const c2 = lines[i] ? lines[i].trim() : '';
      const v2 = lines[i + 1] ? lines[i + 1].trim() : '';
      i += 2;
      if (c2 === '2' && v2 === 'ENTITIES') { inEntities = true; break; }
    }
  }
  if (!inEntities) return entities;

  let current = null;

  while (i + 1 < lines.length) {
    const codeStr = lines[i].trim();
    const valStr  = lines[i + 1].trim();
    i += 2;

    if (codeStr === '0') {
      if (current) { entities.push(current); current = null; }
      if (valStr === 'ENDSEC') break;
      current = {
        type: valStr,
        handle: '',
        layer: '',
        vertices: [],
        texts: [],
      };
      continue;
    }
    if (!current) continue;

    const code = parseInt(codeStr, 10);
    if (isNaN(code)) continue;

    switch (code) {
      case 5:  if (!current.handle) current.handle = valStr; break;
      case 8:  current.layer = valStr; break;
      case 10:
        current._x = parseFloat(valStr);
        if (current.type === 'LWPOLYLINE')
          current.vertices.push({ x: parseFloat(valStr), y: 0 });
        break;
      case 20:
        current._y = parseFloat(valStr);
        if (current.type === 'LWPOLYLINE' && current.vertices.length)
          current.vertices[current.vertices.length - 1].y = parseFloat(valStr);
        break;
      case 30: current._z = parseFloat(valStr); break;
      case 11: current._x2 = parseFloat(valStr); break;
      case 21: current._y2 = parseFloat(valStr); break;
      case 31: current._z2 = parseFloat(valStr); break;
      case 40:
        if (current.type === 'CIRCLE' || current.type === 'ARC')
          current.radius = parseFloat(valStr);
        else if (current.type === 'TEXT' || current.type === 'MTEXT')
          current.height = parseFloat(valStr);
        break;
      case 50:
        if (current.type === 'ARC') current.startAngle = parseFloat(valStr);
        else if (current.type === 'TEXT' || current.type === 'MTEXT')
          current.rotation = parseFloat(valStr);
        break;
      case 51: if (current.type === 'ARC') current.endAngle = parseFloat(valStr); break;
      case 1:
        if (current.type === 'TEXT' || current.type === 'MTEXT')
          current.texts.push(valStr);
        break;
      case 90: current.vertexCount = parseInt(valStr, 10); break;
      case 70: current.flags = parseInt(valStr, 10); break;
      case 2:  if (current.type === 'HATCH') current.pattern = valStr; break;
      default: break;
    }
  }
  if (current) entities.push(current);
  return entities;
}

// ============================================================
// 2. CONVERT ENTITIES → FLAT RECORDS
// ============================================================
function distance(x1, y1, x2, y2) {
  if ([x1, y1, x2, y2].some(v => v == null || isNaN(v))) return '';
  return Math.hypot(x2 - x1, y2 - y1).toFixed(2);
}

function entitiesToRecords(entities) {
  const records = [];
  const keep = ['LWPOLYLINE','LINE','CIRCLE','ARC','HATCH','TEXT','MTEXT'];

  for (const ent of entities) {
    if (!keep.includes(ent.type)) continue;

    const r = {
      Handle: ent.handle || '',
      Type: ent.type,
      Layer: ent.layer || '',
      // ---- Tekla manual-entry columns ----
      Material: '',
      Elevation_mm: '',
      GridLine: '',
      // ---- Geometry ----
      Start_X: '', Start_Y: '',
      End_X: '',   End_Y: '',
      Center_X: '', Center_Y: '',
      Radius: '',
      StartAngle: '', EndAngle: '',
      Closed: '', VertexCount: '',
      Vertices: '',
      Text: '',
      TextHeight: '', Rotation: '',
      Pattern: '',
      // ---- Suggested Tekla properties ----
      TeklaPartType: '',
      Profile: '',
      Length_mm: '', Width_mm: '', Depth_mm: '',
    };

    switch (ent.type) {
      case 'LINE':
        r.Start_X = fmt(ent._x); r.Start_Y = fmt(ent._y);
        r.End_X   = fmt(ent._x2); r.End_Y = fmt(ent._y2);
        r.TeklaPartType = 'Beam';
        r.Length_mm = distance(ent._x, ent._y, ent._x2, ent._y2);
        break;

      case 'LWPOLYLINE': {
        const pts = ent.vertices || [];
        if (pts.length) {
          r.Start_X = fmt(pts[0].x); r.Start_Y = fmt(pts[0].y);
          r.End_X   = fmt(pts[pts.length-1].x);
          r.End_Y   = fmt(pts[pts.length-1].y);
          r.VertexCount = pts.length;
          r.Closed = ent.flags === 1 ? 'Yes' : 'No';
          r.Vertices = pts.map(p => `(${p.x.toFixed(2)},${p.y.toFixed(2)})`).join(' ');
          let len = 0;
          for (let k = 0; k < pts.length - 1; k++)
            len += parseFloat(distance(pts[k].x, pts[k].y, pts[k+1].x, pts[k+1].y) || 0);
          if (ent.flags === 1 && pts.length > 2)
            len += parseFloat(distance(pts[pts.length-1].x, pts[pts.length-1].y, pts[0].x, pts[0].y) || 0);
          r.Length_mm = len.toFixed(2);
        }
        r.TeklaPartType = ent.flags === 1 ? 'Plate/Polygon' : 'Beam';
        break;
      }

      case 'CIRCLE':
        r.Center_X = fmt(ent._x); r.Center_Y = fmt(ent._y);
        r.Radius = fmt(ent.radius);
        r.TeklaPartType = 'Circular Column / Hole';
        if (ent.radius) r.Width_mm = (ent.radius * 2).toFixed(2);
        break;

      case 'ARC':
        r.Center_X = fmt(ent._x); r.Center_Y = fmt(ent._y);
        r.Radius = fmt(ent.radius);
        r.StartAngle = fmt(ent.startAngle);
        r.EndAngle   = fmt(ent.endAngle);
        r.TeklaPartType = 'Curved Beam';
        if (ent.radius != null && ent.startAngle != null && ent.endAngle != null) {
          let sweep = ent.endAngle - ent.startAngle;
          if (sweep < 0) sweep += 360;
          r.Length_mm = ((sweep / 180) * Math.PI * ent.radius).toFixed(2);
        }
        break;

      case 'HATCH':
        r.Pattern = ent.pattern || '';
        r.TeklaPartType = 'Hatch (surface only)';
        break;

      case 'TEXT':
      case 'MTEXT':
        r.Text = ent.texts.join(' | ');
        r.Start_X = fmt(ent._x); r.Start_Y = fmt(ent._y);
        r.TextHeight = fmt(ent.height);
        r.Rotation   = fmt(ent.rotation);
        r.TeklaPartType = 'Annotation';
        break;
    }

    records.push(r);
  }
  return records;
}

function fmt(v) {
  if (v == null || (typeof v === 'number' && isNaN(v))) return '';
  return typeof v === 'number' ? v.toFixed(2) : v;
}

// ============================================================
// 3. AUTO-FILL PROFILE FROM NEARBY TEXT/MTEXT
// ============================================================
function enrichWithNearbyText(records, maxDist = 2000) {
  const texts = records.filter(r => r.Type === 'TEXT' || r.Type === 'MTEXT');
  const parts = records.filter(r => r.Type !== 'TEXT' && r.Type !== 'MTEXT');

  for (const p of parts) {
    const px = parseFloat(p.Start_X || p.Center_X);
    const py = parseFloat(p.Start_Y || p.Center_Y);
    if (isNaN(px) || isNaN(py)) continue;

    let best = null, bestD = Infinity;
    for (const t of texts) {
      const tx = parseFloat(t.Start_X);
      const ty = parseFloat(t.Start_Y);
      if (isNaN(tx) || isNaN(ty)) continue;
      const d = Math.hypot(tx - px, ty - py);
      if (d < bestD) { bestD = d; best = t; }
    }
    if (best && bestD <= maxDist) {
      // Choose the profile-looking text (contains 'x', 'X', '×', or 'Dia')
      if (/[xX×]|Dia|mm/i.test(best.Text)) {
        p.Profile = best.Text;
        const m = best.Text.match(/(\d+(?:\.\d+)?)\s*[xX×]\s*(\d+(?:\.\d+)?)/);
        if (m) { p.Width_mm = m[1]; p.Depth_mm = m[2]; }
      }
    }
  }
  return records;
}

// ============================================================
// 4. CSV GENERATION
// ============================================================
function recordsToCSV(records) {
  if (!records.length) return '';
  const headers = Object.keys(records[0]);
  const esc = v => {
    if (v == null) return '';
    const s = String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const out = [headers.join(',')];
  for (const r of records) out.push(headers.map(h => esc(r[h])).join(','));
  return out.join('\n');
}

function dxfToCSV(dxfText) {
  const ents = parseDXF(dxfText);
  let recs = entitiesToRecords(ents);
  recs = enrichWithNearbyText(recs);
  return { csv: recordsToCSV(recs), records: recs };
}

// ============================================================
// 5. UI WIRING
// ============================================================
const fileInput   = document.getElementById('fileInput');
const convertBtn  = document.getElementById('convertBtn');
const downloadBtn = document.getElementById('downloadBtn');
const tableWrap   = document.getElementById('tableWrap');
const statsBox    = document.getElementById('stats');
const errorBox    = document.getElementById('errorBox');

let lastCSV = '';
let lastFileName = 'output.csv';

fileInput.addEventListener('change', () => {
  convertBtn.disabled = !fileInput.files.length;
  downloadBtn.disabled = true;
  errorBox.innerHTML = '';
});

convertBtn.addEventListener('click', async () => {
  errorBox.innerHTML = '';
  const file = fileInput.files[0];
  if (!file) return;

  try {
    const text = await file.text();
    const { csv, records } = dxfToCSV(text);
    lastCSV = csv;
    lastFileName = file.name.replace(/\.[^.]+$/, '') + '.csv';

    renderStats(records);
    renderTable(records);
    downloadBtn.disabled = records.length === 0;

    if (records.length === 0) {
      errorBox.innerHTML = '<div class="err">No supported entities found in the DXF file.</div>';
    }
  } catch (err) {
    console.error(err);
    errorBox.innerHTML = `<div class="err">Error: ${err.message}</div>`;
  }
});

downloadBtn.addEventListener('click', () => {
  if (!lastCSV) return;
  const blob = new Blob(['\uFEFF' + lastCSV], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = lastFileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

function renderStats(records) {
  const counts = {};
  for (const r of records) counts[r.Type] = (counts[r.Type] || 0) + 1;
  const layers = new Set(records.map(r => r.Layer)).size;
  statsBox.style.display = 'flex';
  statsBox.innerHTML =
    `<span><b>Total entities:</b> ${records.length}</span>` +
    `<span><b>Layers:</b> ${layers}</span>` +
    Object.entries(counts)
      .map(([k, v]) => `<span><b>${k}:</b> ${v}</span>`)
      .join('');
}

function renderTable(records) {
  if (!records.length) {
    tableWrap.innerHTML = '<div class="empty">No records to display.</div>';
    return;
  }
  const headers = Object.keys(records[0]);
  const maxRows = 500; // preview cap
  const shown = records.slice(0, maxRows);

  let html = '<table><thead><tr>';
  for (const h of headers) html += `<th>${escapeHtml(h)}</th>`;
  html += '</tr></thead><tbody>';

  for (const r of shown) {
    html += '<tr>';
    for (const h of headers) {
      const cls = (h === 'Material' || h === 'Elevation_mm' || h === 'GridLine')
        ? ' class="manual"' : '';
      html += `<td${cls}>${escapeHtml(r[h])}</td>`;
    }
    html += '</tr>';
  }
  html += '</tbody></table>';

  if (records.length > maxRows) {
    html += `<div class="empty">Showing first ${maxRows} of ${records.length} rows. Full data will be in the CSV download.</div>`;
  }
  tableWrap.innerHTML = html;
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}
</script>
</body>
</html>
