<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DXF → CSV Exporter</title>
<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
<script src="master.js" type="module" defer></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f6f8;
    margin: 0;
    padding: 24px;
    color: #222;
  }
  .container {
    max-width: 1400px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 28px;
  }
  h1 { margin: 0 0 8px; font-size: 24px; }
  .subtitle { color: #666; margin-bottom: 24px; font-size: 14px; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 20px;
    padding: 16px;
    background: #f9fafb;
    border-radius: 8px;
    border: 1px solid #e5e7eb;
  }
  input[type="file"] {
    padding: 8px;
    border: 1px dashed #94a3b8;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    flex: 1;
    min-width: 220px;
  }
  button {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover:not(:disabled) { background: #1d4ed8; }
  button:disabled { background: #cbd5e1; cursor: not-allowed; }
  button.secondary { background: #059669; }
  button.secondary:hover:not(:disabled) { background: #047857; }
  .stats {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    padding: 12px 16px;
    background: #eff6ff;
    border-left: 4px solid #2563eb;
    border-radius: 6px;
    font-size: 14px;
  }
  .stats span b { color: #1e40af; }
  .tableWrap {
    max-height: 600px;
    overflow: auto;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 12px;
    font-family: "SF Mono", Monaco, Consolas, monospace;
  }
  th {
    position: sticky;
    top: 0;
    background: #1e293b;
    color: #fff;
    padding: 8px 10px;
    text-align: left;
    white-space: nowrap;
    z-index: 1;
  }
  td {
    padding: 6px 10px;
    border-bottom: 1px solid #eef2f7;
    white-space: nowrap;
  }
  tr:hover td { background: #f8fafc; }
  .empty { padding: 40px; text-align: center; color: #94a3b8; }
  .err {
    background: #fef2f2;
    color: #991b1b;
    padding: 12px 16px;
    border-left: 4px solid #dc2626;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 14px;
  }
  .manual { background: #fef9c3 !important; }
</style>
</head>
<body>
	<div>
        <input type="hidden" id="hdnProjectDetail" />
        <input type="hidden" id="hdnProjectName" />
        <input type="hidden" id="hdnUserId" />
        <input type="hidden" id="hdnUserEmail" />
        <input type="hidden" id="hdnUserFirstName" />
        <input type="hidden" id="hdnUserLastName" />
        <input type="hidden" id="hdnUserDetail" />
        <input type="hidden" id="hdnAccessTokenDetail" />
        <input type="hidden" id="hdnLicenseJson" />
        <input type="hidden" ID="hdnDefaultModel" />
    </div>
<div class="container">
  <h1>DXF → CSV Exporter</h1>
  <div class="subtitle">
    Extracts DXF entities (lines, polylines, circles, arcs, text) into CSV for Tekla Structures modeling.
    <b>Yellow columns</b> (Material, Elevation, GridLine) need manual entry.
  </div>

  <div class="controls">
    <input type="file" id="fileInput" accept=".dxf,.txt" />
    <button id="convertBtn" disabled>Convert &amp; Preview</button>
    <button id="downloadBtn" class="secondary" disabled>Download CSV</button>
  </div>

  <div id="errorBox"></div>
  <div id="stats" class="stats" style="display:none;"></div>
  <div id="tableWrap" class="tableWrap"><div class="empty">No file loaded yet.</div></div>
</div>

<script type="module" src="../src/pdf/extractdxfexporter.js"></script>
</body>
</html>
