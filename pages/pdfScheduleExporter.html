<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Column Schedule Extractor</title>
  <style>
    /* :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-alt: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --success: #3fb950;
      --warning: #d29922;
      --danger: #f85149;
    } */
     :root {
			--ink: #17221d;
			--muted: #66736b;
			--paper: #f4f1e8;
			--panel: #fffdf7;
			--line: #d9d4c7;
			--accent: #bd4b2f;
			--accent-dark: #883522;
			--green: #32644b;
      --bg: var(--paper);
      --panel-alt: var(--line);
      --border: var(--line);
      --text: var(--ink);
      --success: var(--green);
      --warning: var(--accent);
      --danger: var(--accent-dark);
		}

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .upload-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 2px dashed var(--border);
      border-radius: 12px;
      background: rgba(22, 27, 34, 0.9);
      min-height: 180px;
      padding: 24px;
      text-align: center;
    }

    .upload-box.dragover {
      border-color: var(--accent);
      background: rgba(88, 166, 255, 0.08);
    }

    input[type="file"] {
      display: none;
    }

    .upload-label {
      display: inline-block;
      background: var(--success);
      color: white;
      border-radius: 8px;
      padding: 12px 24px;
      cursor: pointer;
      font-weight: 600;
    }

    .upload-label:hover {
      filter: brightness(1.05);
    }

    .status {
      color: var(--muted);
      font-size: 0.9rem;
      min-height: 1.2em;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .json-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
      margin-bottom: 12px;
    }

    .output-group {
      display: grid;
      gap: 16px;
      margin-top: 16px;
    }

    .output-label {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    button {
      border: 1px solid var(--border);
      background: var(--panel-alt);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #051320;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0d1117;
    }

    table {
      width: 100%;
      min-width: 1200px;
      border-collapse: collapse;
      font-size: 0.72rem;
    }

    th, td {
      border-bottom: 1px solid var(--border);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
      word-break: break-word;
    }

    th {
      background: var(--panel);
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    td {
      color: var(--text);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 18px;
    }

    .response-box {
      margin-top: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0d1117;
      padding: 12px;
      white-space: pre-wrap;
      font-family: Consolas, monospace;
      font-size: 0.74rem;
      color: var(--text);
      max-height: 280px;
      overflow: auto;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📄 PDF Column Schedule Extractor</h1>
      <div class="subtitle">Upload a Tekla column schedule PDF and call the server extraction endpoint.</div>
    </div>

    <div class="card">
      <div id="uploadArea" class="upload-box">
        <input id="fileInput" type="file" accept="application/pdf" />
        <label class="upload-label" for="fileInput">📤 Select PDF</label>
        <div id="fileStatus" class="status">No file selected</div>
      </div>

      <div class="actions">
        <button id="uploadBtn" class="primary" type="button" disabled>🚀 Extract</button>
        <button id="clearBtn" type="button">🗑️ Clear</button>
      </div>
    </div>

    <div class="card">
      <div class="json-actions">
        <button id="copyJsonBtn" type="button">📋 Copy JSON</button>
        <button id="exportJsonBtn" type="button">💾 Export JSON</button>
        <button id="copyStructuredJsonBtn" type="button">📦 Copy Structured JSON</button>
        <button id="exportStructuredJsonBtn" type="button">💾 Export Structured JSON</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr id="tableHeadRow">
              <th>#</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="10" class="empty">No extracted rows yet.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="output-group">
        <div>
          <div class="output-label">Raw API response</div>
          <div class="response-box" id="responseBox">Response will appear here.</div>
        </div>

        <div>
          <div class="output-label">Structured JSON export</div>
          <div class="response-box" id="structuredResponseBox">Structured JSON will appear here.</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const fileStatus = document.getElementById('fileStatus');
    const uploadBtn = document.getElementById('uploadBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyJsonBtn = document.getElementById('copyJsonBtn');
    const exportJsonBtn = document.getElementById('exportJsonBtn');
    const uploadArea = document.getElementById('uploadArea');
    const tableBody = document.getElementById('tableBody');
    const responseBox = document.getElementById('responseBox');
    const structuredResponseBox = document.getElementById('structuredResponseBox');
    const tableHeadRow = document.getElementById('tableHeadRow');
    const copyStructuredJsonBtn = document.getElementById('copyStructuredJsonBtn');
    const exportStructuredJsonBtn = document.getElementById('exportStructuredJsonBtn');

    let selectedFile = null;
    let currentJsonResult = null;
    let currentStructuredJsonResult = null;

    function setStatus(message, color = '#8b949e') {
      fileStatus.textContent = message;
      fileStatus.style.color = color;
    }

    function renderEmptyState() {
      tableBody.innerHTML = `
        <tr>
          <td colspan="10" class="empty">No extracted rows yet.</td>
        </tr>
      `;
    }

    function getDisplayRows(payload) {
      if (!payload) return [];

      if (Array.isArray(payload)) {
        return payload;
      }

      if (Array.isArray(payload.rows)) {
        return payload.rows;
      }

      if (Array.isArray(payload.data)) {
        return payload.data;
      }

      if (Array.isArray(payload.items)) {
        return payload.items;
      }

      if (Array.isArray(payload.pages)) {
        const flattened = [];
        payload.pages.forEach(page => {
          if (Array.isArray(page.items)) {
            flattened.push(...page.items);
          }
        });
        return flattened;
      }

      if (Array.isArray(payload.column_schedule)) {
        return payload.column_schedule.flatMap(item => Array.isArray(item.rows) ? item.rows : [item]);
      }

      return [];
    }

    function renderRows(rows) {
      if (!rows || rows.length === 0) {
        tableHeadRow.innerHTML = '<th>#</th>';
        renderEmptyState();
        return;
      }

      const allKeys = new Set();
      rows.forEach(row => {
        if (row && typeof row === 'object') {
          Object.keys(row).forEach(key => allKeys.add(key));
        }
      });

      const columns = Array.from(allKeys);
      tableHeadRow.innerHTML = ['#', ...columns].map(key => `<th>${key}</th>`).join('');

      tableBody.innerHTML = rows.map((row, index) => {
        const values = columns.map(key => {
          const value = row && typeof row === 'object' ? row[key] : '';
          if (value === null || value === undefined) return '';
          if (typeof value === 'object') return JSON.stringify(value);
          return String(value);
        });

        return `<tr><td>${index + 1}</td>${values.map(v => `<td>${v}</td>`).join('')}</tr>`;
      }).join('');
    }

    function clearData() {
      selectedFile = null;
      currentJsonResult = null;
      currentStructuredJsonResult = null;
      fileInput.value = '';
      uploadBtn.disabled = true;
      setStatus('No file selected');
      renderEmptyState();
      responseBox.textContent = 'Response will appear here.';
      structuredResponseBox.textContent = 'Structured JSON will appear here.';
    }

    function normalizeJsonKey(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .trim()
        .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
        .replace(/[_\-/]+/g, ' ')
        .replace(/\s+/g, ' ')
        .toLowerCase()
        .replace(/\s+(.)/g, (_, c) => c)
        .replace(/^[a-z]/, (c) => c.toLowerCase());
    }

    function toStructuredColumnRows(rawRows) {
      if (!Array.isArray(rawRows)) return [];

      if (rawRows.some(row => row && typeof row === 'object' && (Array.isArray(row.rows) || row.detail_mark || row.detailMark || row.DetailMark))) {
        return rawRows.map(item => {
          const detailMark = item?.detail_mark ?? item?.detailMark ?? item?.DetailMark ?? 'UNKNOWN';
          const rows = Array.isArray(item?.rows) ? item.rows : [];
          return {
            detail_mark: detailMark,
            rows: rows.map(row => ({
              start_storey: row?.start_storey ?? row?.StartStorey ?? row?.startStorey ?? null,
              end_storey: row?.end_storey ?? row?.EndStorey ?? row?.endStorey ?? null,
              material_grade: row?.material_grade ?? row?.MaterialGrade ?? row?.materialGrade ?? null,
              width_mm: row?.width_mm ?? row?.Width ?? row?.width ?? null,
              breadth_mm: row?.breadth_mm ?? row?.Breadth ?? row?.breadth ?? null,
              main_rebar: row?.main_rebar ?? row?.MainRebar ?? row?.mainRebar ?? null,
              stirrups: row?.stirrups ?? row?.Stirrups ?? row?.stirrup ?? null,
              construction_method: row?.construction_method ?? row?.ConstructionMethod ?? row?.constructionMethod ?? null,
              arrangement_type: row?.arrangement_type ?? row?.ArrangementType ?? row?.arrangementType ?? null,
              splice_dowels: row?.splice_dowels ?? row?.spliceDowels ?? row?.['Splice/Dowels'] ?? null,
              note: row?.note ?? row?.Note ?? null
            }))
          };
        });
      }

      const grouped = new Map();

      rawRows.forEach(row => {
        if (!row || typeof row !== 'object') return;

        const detailMark = row.detail_mark ?? row.detailMark ?? row.DetailMark ?? row['Detail Mark'] ?? 'UNKNOWN';
        if (!grouped.has(detailMark)) {
          grouped.set(detailMark, { detail_mark: detailMark, rows: [] });
        }

        grouped.get(detailMark).rows.push({
          start_storey: row.start_storey ?? row.StartStorey ?? row.startStorey ?? null,
          end_storey: row.end_storey ?? row.EndStorey ?? row.endStorey ?? null,
          material_grade: row.material_grade ?? row.MaterialGrade ?? row.materialGrade ?? null,
          width_mm: row.width_mm ?? row.Width ?? row.width ?? null,
          breadth_mm: row.breadth_mm ?? row.Breadth ?? row.breadth ?? null,
          main_rebar: row.main_rebar ?? row.MainRebar ?? row.mainRebar ?? null,
          stirrups: row.stirrups ?? row.Stirrups ?? row.stirrup ?? null,
          construction_method: row.construction_method ?? row.ConstructionMethod ?? row.constructionMethod ?? null,
          arrangement_type: row.arrangement_type ?? row.ArrangementType ?? row.arrangementType ?? null,
          splice_dowels: row.splice_dowels ?? row.spliceDowels ?? row['Splice/Dowels'] ?? null,
          note: row.note ?? row.Note ?? null
        });
      });

      return Array.from(grouped.values());
    }

    function buildStructuredJson(payload, fallbackFileName = 'column-schedule') {
      if (!payload) return null;

      const base = payload && typeof payload === 'object' ? payload : {};

      if (base.drawing_metadata || base.general_notation_notes || base.column_schedule) {
        return base;
      }

      const rows = getDisplayRows(base);
      const structured = {
        drawing_metadata: {
          drawing_no: base.drawing_metadata?.drawing_no || base.drawing_no || fallbackFileName.replace(/\.[^.]+$/, '') || 'UNKNOWN',
          revision: base.drawing_metadata?.revision || base.revision || 'A',
          drawing_title: base.drawing_metadata?.drawing_title || base.drawing_title || 'COLUMN SCHEDULE',
          project_name: base.drawing_metadata?.project_name || base.project_name || '',
          project_title_parts: base.drawing_metadata?.project_title_parts || base.project_title_parts || [],
          block: base.drawing_metadata?.block || base.block || '',
          lot_no: base.drawing_metadata?.lot_no || base.lot_no || '',
          mukim_no: base.drawing_metadata?.mukim_no || base.mukim_no || '',
          precinct_name: base.drawing_metadata?.precinct_name || base.precinct_name || '',
          scale: base.drawing_metadata?.scale || base.scale || '',
          date: base.drawing_metadata?.date || base.date || '',
          drawn_by: base.drawing_metadata?.drawn_by || base.drawn_by || '',
          checked_by: base.drawing_metadata?.checked_by || base.checked_by || '',
          design_engineer: base.drawing_metadata?.design_engineer || base.design_engineer || '',
          qualified_person: base.drawing_metadata?.qualified_person || base.qualified_person || '',
          owner: base.drawing_metadata?.owner || base.owner || '',
          owner_address: base.drawing_metadata?.owner_address || base.owner_address || '',
          amendment: base.drawing_metadata?.amendment || base.amendment || {
            rev: '',
            description: '',
            date: '',
            by: ''
          },
          copyright_note: base.drawing_metadata?.copyright_note || base.copyright_note || ''
        },
        general_notation_notes: {
          reinforcement_grade: base.general_notation_notes?.reinforcement_grade || base.reinforcement_grade || 'B500B for all column/wall reinforcement',
          column_wall_cage: base.general_notation_notes?.column_wall_cage || base.column_wall_cage || 'Cast-in-situ column/wall to use ColumnCage or equivalent prefabricated reinforcement cage',
          stump_enlargement: base.general_notation_notes?.stump_enlargement || base.stump_enlargement || '',
          spiral_connector_symbol: base.general_notation_notes?.spiral_connector_symbol || base.spiral_connector_symbol || "'p' denotes spiral connector; 's' denotes standard/site splice bar without spiral connector",
          z_suffix: base.general_notation_notes?.z_suffix || base.z_suffix || 'Suffix (z) on wall/column marking denotes columns carrying water tank',
          code_reference: base.general_notation_notes?.code_reference || base.code_reference || 'Definition of properties and reinforcement denotation follows CORENET-X code of practice'
        },
        extraction_caveat: base.extraction_caveat || 'Row alignment reconstructed from a flattened PDF text export. Recommend verifying rebar/stirrup values against the source drawing before construction use.',
        column_schedule: toStructuredColumnRows(rows)
      };

      return structured;
    }

    async function copyJson() {
      if (!currentJsonResult) {
        setStatus('No JSON response to copy yet', '#d29922');
        return;
      }

      try {
        await navigator.clipboard.writeText(JSON.stringify(currentJsonResult, null, 2));
        setStatus('JSON copied to clipboard', '#3fb950');
      } catch (error) {
        console.error('Copy failed:', error);
        setStatus('Copy failed. Please copy manually from the response area.', '#f85149');
      }
    }

    async function copyStructuredJson() {
      if (!currentStructuredJsonResult) {
        setStatus('No structured JSON response to copy yet', '#d29922');
        return;
      }

      try {
        await navigator.clipboard.writeText(JSON.stringify(currentStructuredJsonResult, null, 2));
        setStatus('Structured JSON copied to clipboard', '#3fb950');
      } catch (error) {
        console.error('Structured copy failed:', error);
        setStatus('Structured JSON copy failed. Please copy manually from the response area.', '#f85149');
      }
    }

    function exportJson() {
      if (!currentJsonResult) {
        setStatus('No JSON response to export yet', '#d29922');
        return;
      }

      const blob = new Blob([JSON.stringify(currentJsonResult, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      const fileName = (selectedFile && selectedFile.name ? selectedFile.name.replace(/\.pdf$/i, '') : 'column-schedule') + '.json';

      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);

      setStatus('JSON exported successfully', '#3fb950');
    }

    function exportStructuredJson() {
      if (!currentStructuredJsonResult) {
        setStatus('No structured JSON response to export yet', '#d29922');
        return;
      }

      const blob = new Blob([JSON.stringify(currentStructuredJsonResult, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      const fileName = (selectedFile && selectedFile.name ? selectedFile.name.replace(/\.pdf$/i, '') : 'column-schedule-structured') + '.json';

      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);

      setStatus('Structured JSON exported successfully', '#3fb950');
    }

    fileInput.addEventListener('change', () => {
      const file = fileInput.files && fileInput.files[0];

      if (!file) {
        selectedFile = null;
        uploadBtn.disabled = true;
        setStatus('No file selected');
        return;
      }

      if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
        selectedFile = null;
        fileInput.value = '';
        uploadBtn.disabled = true;
        setStatus('Please select a valid PDF file', '#f85149');
        return;
      }

      selectedFile = file;
      uploadBtn.disabled = false;
      setStatus(`${file.name} selected`, '#3fb950');
    });

    uploadArea.addEventListener('dragover', (event) => {
      event.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (event) => {
      event.preventDefault();
      uploadArea.classList.remove('dragover');
      const file = event.dataTransfer.files && event.dataTransfer.files[0];
      if (!file) return;
      fileInput.files = event.dataTransfer.files;
      fileInput.dispatchEvent(new Event('change'));
    });

    uploadBtn.addEventListener('click', async () => {
      if (!selectedFile) {
        setStatus('Please choose a PDF file first', '#f85149');
        return;
      }

      const formData = new FormData();
      formData.append('file', selectedFile);

      uploadBtn.disabled = true;
      setStatus('Uploading and extracting PDF...', '#d29922');

      try {
        const response = await fetch('/api/pdf/extract-column-schedule', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || `Request failed with status ${response.status}`);
        }

        currentJsonResult = result;
        currentStructuredJsonResult = buildStructuredJson(result, selectedFile?.name || 'column-schedule');
        setStatus(`${result.file || selectedFile.name} processed successfully`, '#3fb950');
        responseBox.textContent = JSON.stringify(result, null, 2);
        structuredResponseBox.textContent = JSON.stringify(currentStructuredJsonResult, null, 2);
        const displayRows = getDisplayRows(result);
        renderRows(displayRows);
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Extraction failed', '#f85149');
        responseBox.textContent = JSON.stringify({ error: error.message }, null, 2);
        renderEmptyState();
      } finally {
        uploadBtn.disabled = false;
      }
    });

    clearBtn.addEventListener('click', clearData);
    copyJsonBtn.addEventListener('click', copyJson);
    exportJsonBtn.addEventListener('click', exportJson);
    copyStructuredJsonBtn.addEventListener('click', copyStructuredJson);
    exportStructuredJsonBtn.addEventListener('click', exportStructuredJson);
    renderEmptyState();
  </script>
</body>
</html>
