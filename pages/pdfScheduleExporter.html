<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Column Schedule Extractor</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-alt: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --success: #3fb950;
      --warning: #d29922;
      --danger: #f85149;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .upload-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 2px dashed var(--border);
      border-radius: 12px;
      background: rgba(22, 27, 34, 0.9);
      min-height: 180px;
      padding: 24px;
      text-align: center;
    }

    .upload-box.dragover {
      border-color: var(--accent);
      background: rgba(88, 166, 255, 0.08);
    }

    input[type="file"] {
      display: none;
    }

    .upload-label {
      display: inline-block;
      background: var(--success);
      color: white;
      border-radius: 8px;
      padding: 12px 24px;
      cursor: pointer;
      font-weight: 600;
    }

    .upload-label:hover {
      filter: brightness(1.05);
    }

    .status {
      color: var(--muted);
      font-size: 0.9rem;
      min-height: 1.2em;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .json-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
      margin-bottom: 12px;
    }

    button {
      border: 1px solid var(--border);
      background: var(--panel-alt);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #051320;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0d1117;
    }

    table {
      width: 100%;
      min-width: 1000px;
      border-collapse: collapse;
      font-size: 0.72rem;
    }

    th, td {
      border-bottom: 1px solid var(--border);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
      word-break: break-word;
    }

    th {
      background: var(--panel);
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    td {
      color: var(--text);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 18px;
    }

    .response-box {
      margin-top: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0d1117;
      padding: 12px;
      white-space: pre-wrap;
      font-family: Consolas, monospace;
      font-size: 0.74rem;
      color: var(--text);
      max-height: 280px;
      overflow: auto;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📄 PDF Column Schedule Extractor</h1>
      <div class="subtitle">Upload a Tekla column schedule PDF and call the server extraction endpoint.</div>
    </div>

    <div class="card">
      <div id="uploadArea" class="upload-box">
        <input id="fileInput" type="file" accept="application/pdf" />
        <label class="upload-label" for="fileInput">📤 Select PDF</label>
        <div id="fileStatus" class="status">No file selected</div>
      </div>

      <div class="actions">
        <button id="uploadBtn" class="primary" type="button" disabled>🚀 Extract</button>
        <button id="clearBtn" type="button">🗑️ Clear</button>
      </div>
    </div>

    <div class="card">
      <div class="json-actions">
        <button id="copyJsonBtn" type="button">📋 Copy JSON</button>
        <button id="exportJsonBtn" type="button">💾 Export JSON</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>DetailMark</th>
              <th>StartStorey</th>
              <th>EndStorey</th>
              <th>Width</th>
              <th>Breadth</th>
              <th>BottomRebar</th>
              <th>TopRebar</th>
              <th>Stirrups</th>
              <th>Method</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="10" class="empty">No extracted rows yet.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="response-box" id="responseBox">Response will appear here.</div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const fileStatus = document.getElementById('fileStatus');
    const uploadBtn = document.getElementById('uploadBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyJsonBtn = document.getElementById('copyJsonBtn');
    const exportJsonBtn = document.getElementById('exportJsonBtn');
    const uploadArea = document.getElementById('uploadArea');
    const tableBody = document.getElementById('tableBody');
    const responseBox = document.getElementById('responseBox');

    let selectedFile = null;
    let currentJsonResult = null;

    function setStatus(message, color = '#8b949e') {
      fileStatus.textContent = message;
      fileStatus.style.color = color;
    }

    function renderEmptyState() {
      tableBody.innerHTML = `
        <tr>
          <td colspan="10" class="empty">No extracted rows yet.</td>
        </tr>
      `;
    }

    function renderRows(rows) {
      if (!rows || rows.length === 0) {
        renderEmptyState();
        return;
      }

      tableBody.innerHTML = rows.map((row, index) => `
        <tr>
          <td>${index + 1}</td>
          <td>${row.DetailMark ?? ''}</td>
          <td>${row.StartStorey ?? ''}</td>
          <td>${row.EndStorey ?? ''}</td>
          <td>${row.Width ?? ''}</td>
          <td>${row.Breadth ?? ''}</td>
          <td>${row.BottomRebar ?? ''}</td>
          <td>${row.TopRebar ?? ''}</td>
          <td>${row.Stirrups ?? ''}</td>
          <td>${row.Method ?? ''}</td>
        </tr>
      `).join('');
    }

    function clearData() {
      selectedFile = null;
      currentJsonResult = null;
      fileInput.value = '';
      uploadBtn.disabled = true;
      setStatus('No file selected');
      renderEmptyState();
      responseBox.textContent = 'Response will appear here.';
    }

    async function copyJson() {
      if (!currentJsonResult) {
        setStatus('No JSON response to copy yet', '#d29922');
        return;
      }

      try {
        await navigator.clipboard.writeText(JSON.stringify(currentJsonResult, null, 2));
        setStatus('JSON copied to clipboard', '#3fb950');
      } catch (error) {
        console.error('Copy failed:', error);
        setStatus('Copy failed. Please copy manually from the response area.', '#f85149');
      }
    }

    function exportJson() {
      if (!currentJsonResult) {
        setStatus('No JSON response to export yet', '#d29922');
        return;
      }

      const blob = new Blob([JSON.stringify(currentJsonResult, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      const fileName = (selectedFile && selectedFile.name ? selectedFile.name.replace(/\.pdf$/i, '') : 'column-schedule') + '.json';

      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);

      setStatus('JSON exported successfully', '#3fb950');
    }

    fileInput.addEventListener('change', () => {
      const file = fileInput.files && fileInput.files[0];

      if (!file) {
        selectedFile = null;
        uploadBtn.disabled = true;
        setStatus('No file selected');
        return;
      }

      if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
        selectedFile = null;
        fileInput.value = '';
        uploadBtn.disabled = true;
        setStatus('Please select a valid PDF file', '#f85149');
        return;
      }

      selectedFile = file;
      uploadBtn.disabled = false;
      setStatus(`${file.name} selected`, '#3fb950');
    });

    uploadArea.addEventListener('dragover', (event) => {
      event.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (event) => {
      event.preventDefault();
      uploadArea.classList.remove('dragover');
      const file = event.dataTransfer.files && event.dataTransfer.files[0];
      if (!file) return;
      fileInput.files = event.dataTransfer.files;
      fileInput.dispatchEvent(new Event('change'));
    });

    uploadBtn.addEventListener('click', async () => {
      if (!selectedFile) {
        setStatus('Please choose a PDF file first', '#f85149');
        return;
      }

      const formData = new FormData();
      formData.append('file', selectedFile);

      uploadBtn.disabled = true;
      setStatus('Uploading and extracting PDF...', '#d29922');

      try {
        const response = await fetch('/api/pdf/extract-column-schedule', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || `Request failed with status ${response.status}`);
        }

        currentJsonResult = result;
        setStatus(`${result.file || selectedFile.name} processed successfully`, '#3fb950');
        responseBox.textContent = JSON.stringify(result, null, 2);
        renderRows(result.rows || []);
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Extraction failed', '#f85149');
        responseBox.textContent = JSON.stringify({ error: error.message }, null, 2);
        renderEmptyState();
      } finally {
        uploadBtn.disabled = false;
      }
    });

    clearBtn.addEventListener('click', clearData);
    copyJsonBtn.addEventListener('click', copyJson);
    exportJsonBtn.addEventListener('click', exportJson);
    renderEmptyState();
  </script>
</body>
</html>
