
<!DOCTYPE html>
<html lang="en">
<head>

<title>YouTube Video Tabs</title>

<meta charset="utf-8" />
<meta http-equiv="Pragma" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />

<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>

<script src="teasermax-master.js" type="module" defer></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 24px;
        background: #f4f6f8;
        color: #222;
    }

    .container {
        max-width: 1000px;
        margin: auto;
        background: white;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    h2 {
        margin-top: 0;
    }

    /* Tab buttons */
    .tab-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        border-bottom: 2px solid #ddd;
        margin-bottom: 20px;
    }

    .tab-button {
        border: none;
        background: #e8edf2;
        color: #333;
        padding: 12px 20px;
        cursor: pointer;
        font-size: 15px;
        border-radius: 6px 6px 0 0;
    }

    .tab-button:hover {
        background: #d5e2ee;
    }

    .tab-button.active {
        background: #1565c0;
        color: white;
    }

    /* Video player */
    .video-wrapper {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
    }

    .video-wrapper iframe {
        width: 100%;
        height: 100%;
        border: 0;
    }

    .description {
        margin-top: 16px;
        color: #555;
        line-height: 1.6;
    }

    @media (max-width: 600px) {
        body {
            padding: 10px;
        }

        .container {
            padding: 14px;
        }

        .tab-button {
            flex: 1;
            padding: 10px;
        }
    }
</style>
</head>

<body>
        
        <asp:HiddenField ID="hdnProjectDetail" runat="server" />
        <asp:HiddenField ID="hdnProjectName" runat="server" />
        <asp:HiddenField ID="hdnUserId" runat="server" />
        <asp:HiddenField ID="hdnUserEmail" runat="server" />
        <asp:HiddenField ID="hdnUserFirstName" runat="server" />
        <asp:HiddenField ID="hdnUserLastName" runat="server" />
        <asp:HiddenField ID="hdnUserDetail" runat="server" />
        <asp:HiddenField ID="hdnAccessTokenDetail" runat="server" />
        <asp:HiddenField ID="hdnLicenseJson" runat="server" />

<div class="container">

    <h2>Build the Impossible</h2>
    <p>Select a tab to watch a video.</p>

    <div class="tab-buttons" id="videoTabs" role="tablist"></div>

    <div class="video-wrapper">
        <iframe
            id="youtubePlayer"
            title="Engineering and BIM video"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
        </iframe>
    </div>

    <div class="description" id="videoDescription"></div>

</div>

<script>
    const videos = [
        {
            id: "n-uMUeBKNGw",
            title: "Draw2Deliver AI",
            description: "Draw2Deliver AI is an AI-powered precast BIM workflow that takes a project from structural drawings to installed elements on one connected platform. It combines Claude, Tekla Structures and Trimble Connect, so teams spend less time on manual re-entry and have full visibility from design to site."
        },
        {
            id: "lHaABYfB_yU",
            title: "AI-Powered Construction Satefy & Trimble Connect CDE",
            description: "Enhance construction site safety with AI-powered PPE compliance detection, dangerous-zone monitoring, scaffolding inspection, and forklift blind-spot worker detection. Integrated with Trimble Connect as the Common Data Environment (CDE), the solution enables real-time status monitoring, centralized dashboards, instant alerts, issue reporting, and seamless team collaboration—helping prevent accidents, improve compliance, and deliver safer, smarter, more productive construction projects."
        },
        {
            id: "sHGHqXBf1P8",
            title: "Status Tracking Dashboard",
            description: "Track status of precast elements of a single project across all stages in real time and accessible by all stakeholders"
        },
        {
            id: "3BZyD6J1UJI",
            title: "AC Checker",
            description: "An Accredited Checker (AC) is a qualified and independent structural engineer who reviews, validates, and verifies the structural design information contained in a BIM model. "
        },
        {
            id: "a2QfRBMHK_Q",
            title: "Shop Drawing Approval",
            description: "The Precast manufacturer needs to track the drawings revisions manually because individual will have their own copy of the drawing revisions saved at their personal computer. Then they will have to combine and update it into the Master Drawing List (MDL) for weekly or monthly report so this process could be tedious and may spend a lot of time to do it."
        }
    ];

    const videoTabs = document.getElementById("videoTabs");

    videos.forEach((video, index) => {
        const button = document.createElement("button");
        button.className = "tab-button";
        button.type = "button";
        button.setAttribute("role", "tab");
        button.setAttribute("aria-selected", "false");
        button.textContent = video.title;
        button.title = video.title;
        button.addEventListener("click", () => showVideo(index));
        videoTabs.appendChild(button);
    });

    function showVideo(index) {
        const video = videos[index];

        document.getElementById("youtubePlayer").src =
            "https://www.youtube.com/embed/" + video.id +
            "?autoplay=1&mute=0&cc_load_policy=1&cc_lang_pref=en&hl=en";

        document.getElementById("videoDescription").textContent =
            video.description;

        document.querySelectorAll(".tab-button").forEach((button, i) => {
            button.classList.toggle("active", i === index);
            button.setAttribute("aria-selected", i === index ? "true" : "false");
        });
    }

    showVideo(0);
</script>

</body>
</html>
